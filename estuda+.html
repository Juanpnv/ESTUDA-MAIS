login:()=>`<div style="text-align:center;margin-top:30px">${logo}<p style="font-size:15px;margin:4px 0 20px">Entre para continuar</p></div><div class="if">${I("prof",20)}<input id="e" placeholder="Usuário ou e-mail" autocomplete="username"></div><div class="if">${I("lock",20)}<input id="p" type="password" placeholder="Senha" autocomplete="current-password"><button class="ib" onclick="const p=$('#p');p.type=p.type=='password'?'text':'password'">${I("eye",20)}</button></div><div class="err" id="er"></div><button class="btn" onclick="login()">Entrar</button><p style="text-align:center;font-size:13px" onclick="er('Recuperação por e-mail exige um backend (ainda não conectado).')">Esqueceu sua senha?</p><div class="or"><i></i>ou<i></i></div><button class="btn o" onclick="go('reg')">Criar uma conta</button><button class="btn o" style="border-style:dashed" onclick="guest()">Entrar sem conta</button><p class="mu" style="text-align:center;font-size:12px">Como visitante, seus dados ficam só neste aparelho.</p>`,
reg:()=>`<h1 style="margin-top:12px">Criar conta</h1><p class="mu" style="margin:0 0 14px">Monte seu plano de estudos em poucos passos.</p><div class="if">${I("prof",20)}<input id="n" placeholder="Nome" maxlength="40" autocomplete="name"></div><div class="if">${I("mail",20)}<input id="e" type="email" placeholder="E-mail" autocomplete="email"></div><div class="if">${I("lock",20)}<input id="p" type="password" placeholder="Senha" autocomplete="new-password"></div><div class="if">${I("lock",20)}<input id="p2" type="password" placeholder="Confirmar senha" autocomplete="new-password"></div><div class="if">${I("subs",20)}<select id="y">${["1º ano EF","2º ano EF","3º ano EF","4º ano EF","5º ano EF","6º ano EF","7º ano EF","8º ano EF","9º ano EF","1º ano EM","2º ano EM","3º ano EM"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="if">${I("target",20)}<select id="o"><option>Melhorar notas</option><option>Preparar-se para provas</option><option>Preparar-se para olimpíadas</option><option>Aprender conteúdos novos</option><option>Organizar os estudos</option></select></div><div class="err" id="er"></div><button class="btn" onclick="reg()">Cadastrar</button><button class="btn o" onclick="go('login')">Já tenho conta</button>`,
home:()=>{const T=TS(),dn=T.filter(t=>t.ok).length,pd=T.filter(t=>!t.ok),at=pd.filter(t=>t.date<TODAY).length,p=T.length?Math.round(100*dn/T.length):0,nx=pd.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3),rv=rev()[0],mn=D.min[(new Date().getDay()+6)%7],pc=n=>T.length?Math.round(100*n/T.length):0;
 return`<div class="hh"><button class="mb" onclick="menu()" aria-label="Menu">${I("menu",24)}</button><h1 class="lg">Estuda<span>+</span></h1><div class="tg">DISCIPLINA • FOCO • RESULTADOS</div></div>
<div class="gt"><div class="gb"><h2>Olá, ${esc(U[cur].name.split(" ")[0])}!</h2><p>Bora continuar evoluindo!</p></div><div class="fl" title="Sequência de estudos">${I("flame",20)}${D.streak}</div></div>
<div class="pc"><div class="donut" style="background:conic-gradient(var(--rd) ${p*3.6}deg,var(--c2) 0)"><b>${p}%</b></div><i class="dv"></i><div><div class="mu row" style="gap:8px">${I("target",20)}Seu progresso hoje!</div><b style="font-size:44px;line-height:1.1">${p}%</b><div class="mu">${dn} de ${T.length} tarefas</div></div></div>
<div class="grid sts"><div class="c">${dot("#22c55e",I("check",16,3))}<b>${dn}</b><span class="mu">Concluídas</span><div class="sb"><i style="width:${pc(dn)}%;background:#22c55e"></i></div></div><div class="c">${dot("#f59e0b",I("clock",16))}<b>${pd.length}</b><span class="mu">Pendentes</span><div class="sb"><i style="width:${pc(pd.length)}%;background:#f59e0b"></i></div></div><div class="c">${dot("#e11d2e","!")}<b>${at}</b><span class="mu">Atrasadas</span><div class="sb"><i style="width:${pc(at)}%;background:#e11d2e"></i></div></div></div>
<div class="c tk" onclick="go('prof')">${I("cal",24)}<div class="g"><div class="row sp"><b>Meta diária</b><span class="mu dt">${I("clock",16)}${mn} min de ${D.meta}h</span></div><div class="bar"><i style="width:${Math.min(100,Math.round(100*mn/(D.meta*60)))}%"></i></div></div>${I("chev",18)}</div>
${rv?`<div class="c tk" onclick="startQuiz('${rv.s}',${rv.t})"><div class="g"><b>Revisão recomendada</b><div class="mu">Você teve dificuldade em ${esc(SUB[sid(rv.s)][4][rv.t])}. Toque para revisar.</div></div>${I("chev",18)}</div>`:""}

 return`<div class="tabs">${[["w","Semana"],["m","Mês"],["a","Todo o tempo"]].map(x=>`<button class="${ST==x[0]?"on":""}" onclick="ST='${x[0]}';R()">${x[1]}</button>`).join("")}</div>
<div class="pf"><b>Seu desempenho</b><div class="row" style="gap:18px;margin-top:10px"><div class="donut" style="width:110px;height:110px;background:conic-gradient(var(--gr) ${pc*3.6}deg,var(--rd) 0 ${(pc+pe)*3.6}deg,#71717a 0)"><b style="width:90px;height:90px;font-size:24px">${pc}%</b></div><div class="g leg">${[["var(--gr)","Acertos",pc],["var(--rd)","Erros",pe],["#71717a","Em branco",pb]].map(x=>`<div class="row sp"><span><i style="background:${x[0]}"></i>${x[1]}</span><span>${x[2]}%</span></div>`).join("")}</div></div><div class="mu" style="margin-top:8px">${n} questões respondidas</div></div>

<h2>Revisão recomendada</h2>${rv.map(r=>`<div class="c tk" onclick="startQuiz('${r.s}',${r.t})"><div class="g"><b>${SUB[sid(r.s)][4][r.t]}</b><div class="mu">${r.a}% de acertos — recomendamos revisar</div></div>${I("chev",18)}</div>`).join("")||emp("target","Responda exercícios para receber recomendações de revisão.")}`},
prof:()=>{const u=U[cur],n=D.ok+D.er+D.bl,td=TS().filter(t=>t.ok).length,nx=100-D.xp%100,row=(i,t,sub,act,right)=>`<div class="mr2" ${act?`onclick="${act}"`:""}><span class="ib3">${I(i,22)}</span><div class="g"><b>${t}</b><div class="mu">${sub}</div></div>${right||I("chev",20)}</div>`,tg=(k)=>`<button class="sw ${D[k]?"on":""}" onclick="D.${k}=D.${k}?0:1;save();R()" aria-label="Alternar"></button>`;
 return`<h1 style="font-size:34px;margin:4px 0 14px">Perfil</h1>
<div class="pf"><div class="row" style="gap:16px"><div class="pa">${LG.replace('width="120" height="120"','width="54" height="54"')}</div><div class="g" style="min-width:0"><div class="row" style="gap:0"><b style="font-size:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.name)}</b><span class="vf">${I("check",12,3.5)}</span></div><div class="mu" style="font-size:15px;overflow:hidden;text-overflow:ellipsis">${cur=="convidado"?"Modo visitante (sem conta)":esc(cur)}</div><span class="pl">${I("trophy",16)}${D.g[1]}º ano ${D.g[0]=="f"?"EF":"EM"}</span></div></div>
<div class="ps">${[["target",n,"Questões respondidas"],["stats",pct()+"%","Acertos"],["check",td,"Tarefas concluídas"],["flame",D.streak,"Dias seguidos"]].map(x=>`<div><span>${I(x[0],24)}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div></div>

<div class="c mn">${row("out","Sair da Conta","Encerre sua sessão com segurança","out()")}</div>`},

metas:()=>{const mt=D.mt||80,mn=D.min[(new Date().getDay()+6)%7],T=TS(),tp2=T.length?Math.round(100*T.filter(t=>t.ok).length/T.length):0;return`${hdb("prof","Metas")}
<div class="c"><div class="row sp"><b>Meta diária de estudo</b><span class="row" style="gap:10px"><button class="stp" onclick="D.meta=Math.max(1,D.meta-1);save();R()" aria-label="Diminuir">−</button><b>${D.meta}h</b><button class="stp" onclick="D.meta=Math.min(12,D.meta+1);save();R()" aria-label="Aumentar">+</button></span></div><div class="bar"><i style="width:${Math.min(100,Math.round(100*mn/(D.meta*60)))}%"></i></div><div class="mu" style="margin-top:6px">Hoje: ${mn} min de ${D.meta}h</div></div>
<div class="c"><div class="row sp"><b>Meta de conclusão de tarefas</b><span class="row" style="gap:10px"><button class="stp" onclick="D.mt=Math.max(10,${mt}-10);save();R()" aria-label="Diminuir">−</button><b>${mt}%</b><button class="stp" onclick="D.mt=Math.min(100,${mt}+10);save();R()" aria-label="Aumentar">+</button></span></div><div class="bar"><i style="width:${Math.min(100,Math.round(100*tp2/mt))}%"></i></div><div class="mu" style="margin-top:6px">${tp2}% das tarefas concluídas</div></div>`},
conq:()=>`${hdb("prof","Conquistas")}<div class="bg" style="grid-template-columns:1fr">${[["check","Primeira tarefa","Conclua uma tarefa",TS().some(t=>t.ok)],["flame","7 dias estudando","Estude 7 dias seguidos",D.streak>=7],["subs","100 questões","Responda 100 questões",D.ok+D.er+D.bl>=100],["target","90% de acertos","Mantenha 90% de acertos",pct()>=90&&D.ok>9]].map(a=>`<div class="bd ${a[3]?"on":""}">${I(a[0],26)}<div><b>${a[1]}</b><div style="font-size:12px">${a[2]}</div></div></div>`).join("")}</div>`,
agenda:()=>{const{y,m,sel}=CM,f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),pn=new Date(y,m,0).getDate(),M=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],W=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"],c=[],sd=new Date(sel+"T12:00:00");let j=1;
 for(let i=0;i<f;i++)c.push(`<span class="dy mu">${pn-f+1+i}</span>`);
 for(let d=1;d<=n;d++){const k=dstr(new Date(y,m,d));c.push(`<button class="dy ${k==sel?"on":""} ${k==TODAY?"td":""}" onclick="CM.sel='${k}';R()">${d}${TS().some(t=>t.date==k)?"<u></u>":""}</button>`)}
 while(c.length%7)c.push(`<span class="dy mu">${j++}</span>`);
 const ev=TS().filter(t=>t.date==sel).sort((a,b)=>a.time.localeCompare(b.time));
 return`<h1>Agenda</h1><div class="pf" style="padding:14px"><div class="row sp" style="margin:0 0 8px"><button class="hb" onclick="mm(-1)">${I("back")}</button><b>${M[m][0].toUpperCase()+M[m].slice(1)} ${y}</b><button class="hb" onclick="mm(1)">${I("chev")}</button></div><div class="cal">${["D","S","T","Q","Q","S","S"].map(x=>`<span class="mu">${x}</span>`).join("")}${c.join("")}</div></div><h2>${sel==TODAY?"Hoje - ":""}${W[sd.getDay()]}, ${sd.getDate()} de ${M[sd.getMonth()]}</h2>${ev.map(t=>{const i=Math.max(0,sid(t.s));return`<div class="c tk">${icr(i)}<div class="g"><b>${SUB[i][1]}</b><div class="mu">${t.time} · ${esc(t.d)}</div></div></div>`}).join("")||emp("cal","Nada agendado neste dia.")}<button class="btn" onclick="tform(0,'${sel}')">+ Adicionar à agenda</button>`},

notif:()=>{const pd=TS().filter(t=>!t.ok),L=[],r=rev()[0];pd.filter(t=>t.date<TODAY).forEach(t=>L.push("Tarefa atrasada: "+t.d));pd.filter(t=>t.date==TODAY).forEach(t=>L.push("Hoje às "+t.time+": "+t.d));if(r)L.push("Revisão recomendada: "+SUB[sid(r.s)][4][r.t]);L.push("Meta de hoje: estudar "+D.meta+"h");return`${hdb("home","Notificações")}${D.notif?'<div class="c mn">'+L.map(x=>`<div class="mr2"><span class="ib3">${I("bell",20)}</span><div class="g">${esc(x)}</div></div>`).join("")+"</div>":emp("bell","Notificações desativadas. Ative no Perfil.")}`},

function tg(id){const t=TS().find(x=>x.id==id);t.ok=t.ok?0:1;if(t.ok){D.xp+=15;toast("+15 XP · tarefa concluída")}save();R()}
function tform(id,dt){const t=TS().find(x=>x.id==id)||{s:"mat",d:"",date:dt||TODAY,time:"14:00",pr:"Média"};
 $("#app").innerHTML=`<h1>${id?"Editar":"Nova"} tarefa</h1><select class="in" id="ts">${SUB.map(s=>`<option value="${s[0]}" ${s[0]==t.s?"selected":""}>${s[1]}</option>`).join("")}</select><input class="in" id="td" placeholder="Descrição" maxlength="80" value="${esc(t.d)}"><input class="in" id="tdt" type="date" value="${t.date}"><input class="in" id="ttm" type="time" value="${t.time}"><select class="in" id="tpr">${["Alta","Média","Baixa"].map(p=>`<option ${p==t.pr?"selected":""}>${p}</option>`).join("")}</select><div class="err" id="er"></div><button class="btn" onclick="tsave(${id||0})">Salvar</button>${id?`<button class="btn o" onclick="D.tasks=D.tasks.filter(x=>x.id!=${id});save();go('tasks')">Excluir</button>`:""}<button class="btn o" onclick="go('tasks')">Cancelar</button>`}
function tsave(id){const d=$("#td").value.trim();if(!d||!$("#tdt").value)return er("Preencha a descrição e a data.");const o={s:$("#ts").value,d,date:$("#tdt").value,time:$("#ttm").value||"00:00",pr:$("#tpr").value};
 if(id)Object.assign(TS().find(x=>x.id==id),o);else D.tasks.push({id:Date.now(),ok:0,g:D.g,...o});save();toast("Tarefa salva");go("tasks")}
function startQuiz(s,t){let l=Q.filter(q=>qa(q)&&q.s==s&&(t<0||q.t==t));if(!l.length)l=Q.filter(q=>qa(q)&&q.s==s);if(!l.length){toast("Ainda não há questões neste tópico.");return}
 Z={s,t,l,i:0,sc:0,sel:null,ok:null};if(t>=0&&!D.td[D.g+s+t]){D.tp[D.g+s+t]=D.tp[D.g+s+t]||{c:0,w:0};save()}go("quiz")}
function pick(k){if(Z.ok==null){Z.sel=k;R()}}
function rec(c,b){const q=Z.l[Z.i],k=D.g+q.s+q.t;D.tp[k]=D.tp[k]||{c:0,w:0};if(b){D.bl++}else if(c){D.ok++;D.tp[k].c++;Z.sc++;D.xp+=10}else{D.er++;D.tp[k].w++}Z.ok=c;save();R()}
function conf(){if(Z.sel==null)return;rec(Z.sel==Z.l[Z.i].a,0)}
function blank(){Z.sel=-1;rec(false,1)}
function next(){if(Z.i+1<Z.l.length){Z.i++;Z.sel=null;Z.ok=null}else{Z.end=1;const w=(new Date().getDay()+6)%7;D.min[w]+=Z.l.length*2;D.tm=(D.tm||0)+Z.l.length*2;if(D.last!=TODAY){D.streak=D.last==YEST?D.streak+1:1;D.last=TODAY}if(Z.t>=0&&Z.sc/Z.l.length>=.6)D.td[D.g+Z.s+Z.t]=1;save()}R()}
function rev(){const r=[];for(const k in D.tp){if(!k.startsWith(D.g))continue;const x=D.tp[k],n=x.c+x.w;if(n>0&&!D.td[k]||n>0&&x.c/n<.7){const a=Math.round(100*x.c/n);if(a<70)r.push({s:k.slice(2,5),t:+k.slice(5),a})}}return r.sort((a,b)=>a.a-b.a)}
R();
