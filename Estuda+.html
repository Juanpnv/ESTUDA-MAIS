{const V=[["engineer","engenheiro"],["lawyer","advogado"],["dentist","dentista"],["farmer","agricultor"],["chef","cozinheiro"],["artist","artista"],["Japan","Japão"],["Germany","Alemanha"],["Spain","Espanha"],["cheese","queijo"],["rice","arroz"],["chicken","frango"],["eggs","ovos"]],X=B7("ing",2,"Reconhecer palavras em inglês: profissões, países e alimentos"),v=(j,k)=>[2,5,9].map(d=>V[(j+d)%13][k]);

const L={f7mat0:{p:[["Potências e raízes", "Potência é multiplicar fatores iguais: 2⁴ = 16. A raiz quadrada desfaz o quadrado: √144 = 12.", "10⁴ = 10 000."], ["Fatoração", "Fatorar é escrever um número como produto de primos. 12 = 2² × 3.", "30 = 2 × 3 × 5."], ["MMC e MDC em problemas", "Use o MMC para eventos que se repetem juntos e o MDC para dividir em partes iguais, as maiores possíveis.", "Ônibus a cada 12 e 18 min saem juntos a cada 36 min."], ["Expressões", "Resolva primeiro parênteses, depois potências e raízes, multiplicações e divisões, e por fim somas e subtrações.", "5 + 2 × 3² = 23."], ["Divisibilidade e primos", "Critérios: par (2), soma dos algarismos (3), termina em 0 ou 5 (5). Primos só têm dois divisores.", "23, 29, 31 e 37 são primos."]],o:"Operar com potências, fatoração, MMC, MDC e raízes em problemas.",h:"Operar com potências, fatoração, MMC, MDC e raízes em problemas.",x:"Potência é multiplicar fatores iguais: 2⁴ = 16. A raiz quadrada desfaz o quadrado: √144 = 12.",e:"10⁴ = 10 000."},
f7mat1:{p:[["Potências de inteiros", "Expoente par dá resultado positivo e expoente ímpar mantém o sinal da base negativa.", "(−2)³ = −8 e (−3)² = 9."], ["Expressões", "Siga a ordem das operações e use as regras de sinais: sinais iguais dão positivo, diferentes dão negativo.", "(−3) × 4 + 10 = −2."], ["Problemas", "Em saldos, temperaturas e profundidades, some e subtraia na reta numérica.", "−4 + 9 = 5."], ["Oposto e módulo", "O oposto troca o sinal. O módulo é a distância até o zero e nunca é negativo.", "|−9| + |4| = 13."], ["Comparar e ordenar", "Na reta, quanto mais à direita, maior o número. Entre −3 e 4 há 6 inteiros.", "−7 < −2 < 0 < 3."]],o:"Operar com inteiros em expressões e problemas.",h:"Operar com inteiros em expressões e problemas.",x:"Expoente par dá resultado positivo e expoente ímpar mantém o sinal da base negativa.",e:"(−2)³ = −8 e (−3)² = 9."},
f7mat2:{p:[["Soma e subtração", "Com denominadores diferentes, ache o MMC e converta as frações antes de operar.", "2/3 + 1/4 = 8/12 + 3/12 = 11/12."], ["Multiplicação", "Multiplique os numeradores e os denominadores, simplificando antes se possível.", "2/3 × 9/4 = 3/2."], ["Divisão", "Dividir por uma fração é multiplicar pelo inverso dela.", "3/4 ÷ 9/8 = 3/4 × 8/9 = 2/3."], ["Comparar e simplificar", "Para comparar, use o mesmo denominador. Para simplificar, divida em cima e embaixo pelo mesmo número.", "18/24 = 3/4."], ["Problemas", "Leia a situação, descubra a operação e confira se o resultado faz sentido.", "3/8 de 48 = 18."]],o:"Operar e comparar números racionais em forma de fração.",h:"Operar e comparar números racionais em forma de fração.",x:"Com denominadores diferentes, ache o MMC e converta as frações antes de operar.",e:"2/3 + 1/4 = 8/12 + 3/12 = 11/12."},
f7mat3:{p:[["Dízimas periódicas", "Algumas frações geram decimais infinitos que se repetem: 1/3 = 0,333…", "5/6 = 0,8333…"], ["Potências de 10", "Multiplicar por 10, 100 ou 1000 move a vírgula para a direita; dividir move para a esquerda.", "3,4 × 10² = 340."], ["Notação científica", "Escrevemos o número como a × 10ⁿ, com a entre 1 e 10.", "5 000 000 = 5 × 10⁶."], ["Operações", "Ao multiplicar, conte as casas decimais. Ao dividir, multiplique dividendo e divisor por potências de 10.", "12,6 ÷ 0,3 = 126 ÷ 3 = 42."], ["Problemas e arredondamento", "Em problemas com preços e medidas, confira as casas decimais. Para arredondar, olhe a casa seguinte.", "7,856 → 7,86."]],o:"Operar com decimais, dízimas, potências de 10 e notação científica.",h:"Operar com decimais, dízimas, potências de 10 e notação científica.",x:"Algumas frações geram decimais infinitos que se repetem: 1/3 = 0,333…",e:"5/6 = 0,8333…"},
f7mat4:{p:[["Regra de três", "Grandezas diretas crescem juntas; inversas, uma cresce quando a outra diminui.", "3 cadernos custam R$ 24; 5 custam R$ 40."], ["Razão e proporção", "Razão compara duas quantidades. Proporção é a igualdade entre duas razões.", "3 para 2 em 30 alunos: 18 e 12."], ["Juros simples", "Juros = capital × taxa × tempo. Montante = capital + juros.", "500 × 0,02 × 3 = 30."], ["Aumentos e descontos", "Aumento de 10% multiplica por 1,1; desconto de 20% multiplica por 0,8. Sucessivos se multiplicam.", "100 × 1,1 × 1,1 = 121."], ["Porcentagem de quantidade", "p% de n = p/100 × n. Para achar o total, divida a parte pela porcentagem.", "30% de x é 21: x = 70."]],o:"Resolver regra de três, razões, proporções, juros simples e porcentagens.",h:"Resolver regra de três, razões, proporções, juros simples e porcentagens.",x:"Grandezas diretas crescem juntas; inversas, uma cresce quando a outra diminui.",e:"3 cadernos custam R$ 24; 5 custam R$ 40."},
f7mat5:{p:[["O que é uma equação", "Equação é uma igualdade com uma incógnita. Resolver é achar o valor que a torna verdadeira.", "2x + 5 = 17 vale para x = 6."], ["Equilíbrio", "Faça a mesma operação nos dois lados para isolar a incógnita.", "3x − 4 = 11 → 3x = 15 → x = 5."], ["Parênteses e frações", "Use a distributiva e multiplique pelo denominador para eliminar frações.", "4(x − 2) = 12 → x = 5."], ["Incógnita dos dois lados", "Junte as incógnitas de um lado e os números do outro.", "2x + 3 = x + 10 → x = 7."], ["Problemas", "Traduza a história em uma equação, resolva e confira.", "O dobro de um número mais 7 é 25: 2x + 7 = 25."]],o:"Resolver equações do 1º grau e problemas com equações.",h:"Resolver equações do 1º grau e problemas com equações.",x:"Equação é uma igualdade com uma incógnita. Resolver é achar o valor que a torna verdadeira.",e:"2x + 5 = 17 vale para x = 6."},
f7mat7:{p:[["Retas paralelas", "Cortadas por uma transversal, correspondentes e alternos internos são iguais e colaterais internos somam 180°.", "Ângulos opostos pelo vértice são iguais."], ["Triângulos", "A soma dos ângulos internos é 180°. Existem equilátero, isósceles e escaleno, e a desigualdade triangular limita os lados.", "50° + 60° + 70° = 180°."], ["Polígonos", "A soma dos ângulos internos é (n − 2) × 180°. No hexágono regular, cada ângulo mede 120°.", "Pentágono: 540°."], ["Circunferência e círculo", "Comprimento = 2 × π × r e área = π × r². O diâmetro é o dobro do raio.", "r = 3: área ≈ 28,26 cm²."], ["Áreas e volume", "Paralelogramo: base × altura. Trapézio: (B + b) × h ÷ 2. Losango: D × d ÷ 2. Volume do cubo: aresta³.", "Cubo de aresta 4: 64 cm³."]],o:"Reconhecer ângulos entre paralelas, triângulos, polígonos, círculo e calcular áreas.",h:"Reconhecer ângulos entre paralelas, triângulos, polígonos, círculo e calcular áreas.",x:"Cortadas por uma transversal, correspondentes e alternos internos são iguais e colaterais internos somam 180°.",e:"Ângulos opostos pelo vértice são iguais."},
f7por0:{p:[["Ideia central", "A ideia central é aquilo que o texto defende ou explica como um todo.", "O celular ajuda e atrapalha, por isso precisa de regras."], ["Argumentos", "Os argumentos são as razões que sustentam a ideia central: dados, exemplos e causas.", "A reciclagem reduz o lixo e economiza matéria-prima."], ["Conectivos", "Palavras como mas, porém, por isso e além disso mostram relações de oposição, consequência e soma.", "“Por isso” liga causa e consequência."], ["Informações do texto", "Localize no texto os dados pedidos: quem, o quê, quanto e por quê.", "Adolescentes precisam de oito a dez horas de sono."], ["Título", "O título combina com o assunto e com a ideia central do texto.", "“A importância do sono”."]],o:"Identificar ideia central, argumentos e informações em textos opinativos.",h:"Identificar ideia central, argumentos e informações em textos opinativos.",x:"A ideia central é aquilo que o texto defende ou explica como um todo.",e:"O celular ajuda e atrapalha, por isso precisa de regras."},
f7por1:{p:[["Tempos do verbo", "Presente (estuda), pretérito perfeito (comi), pretérito imperfeito (brincava) e futuro do presente (viajaremos).", "Ontem eu comi pizza: pretérito perfeito."], ["Perfeito e imperfeito", "O perfeito indica ação concluída; o imperfeito, ação habitual ou em andamento no passado.", "Eu morava em Recife: pretérito imperfeito."], ["Modos verbais", "Indicativo (fatos), subjuntivo (dúvida ou desejo), imperativo (ordem) e formas nominais (infinitivo).", "Feche a porta: imperativo."], ["Preposição e conjunção", "A preposição liga palavras (sem, sobre). A conjunção liga orações (mas, portanto, logo).", "Estudo muito, portanto passarei."], ["Advérbio e pronome", "O advérbio modifica o verbo (muito bem, nunca). O pronome substitui um nome (aquele, alguém).", "Eles nunca chegam cedo."]],o:"Reconhecer tempos e modos verbais e classes de palavras.",h:"Reconhecer tempos e modos verbais e classes de palavras.",x:"Presente (estuda), pretérito perfeito (comi), pretérito imperfeito (brincava) e futuro do presente (viajaremos).",e:"Ontem eu comi pizza: pretérito perfeito."},
f7por2:{p:[["Sílaba tônica", "A sílaba tônica é a pronunciada com mais força: oxítona (última), paroxítona (penúltima) e proparoxítona (antepenúltima).", "ca-FÉ: oxítona."], ["Proparoxítonas", "Todas as proparoxítonas são acentuadas: lâmpada, música, médico.", "sábado é proparoxítona."], ["Oxítonas", "As oxítonas terminadas em a, e, o (com ou sem s) são acentuadas: sofá, café, jacaré, avô.", "jacaré leva acento."], ["Paroxítonas", "Muitas paroxítonas terminam em l, r, x, ps ou ditongo e levam acento: fácil, açúcar.", "Fácil leva acento; caderno não."], ["Monossílabos", "Os monossílabos tônicos terminados em a, e, o são acentuados: pá, pé, nó.", "mês e pé são monossílabos tônicos."]],o:"Classificar palavras pela sílaba tônica e aplicar regras de acentuação.",h:"Classificar palavras pela sílaba tônica e aplicar regras de acentuação.",x:"A sílaba tônica é a pronunciada com mais força: oxítona (última), paroxítona (penúltima) e proparoxítona (antepenúltima).",e:"ca-FÉ: oxítona."},
f7por3:{p:[["Vírgula", "A vírgula separa itens, chama alguém, isola o aposto e separa orações adverbiais deslocadas.", "Quando cheguei, todos já tinham saído."], ["Ponto e vírgula", "O ponto e vírgula separa partes de uma frase com ideias ligadas, com pausa maior que a vírgula.", "Estudei muito; por isso, passei."], ["Dois-pontos", "Os dois-pontos anunciam uma lista, uma fala ou uma explicação.", "Ana comprou frutas: maçã, uva e pera."], ["Aspas, parênteses e travessão", "As aspas marcam citações, os parênteses trazem informações extras e o travessão indica a fala em diálogos.", "Ela disse: “Vou ao cinema”."], ["O que evitar", "Não separe o sujeito do verbo com vírgula quando eles estão ligados.", "Meu irmão chegou cedo (sem vírgula)."]],o:"Pontuar frases com vírgula, ponto e vírgula, dois-pontos e outros sinais.",h:"Pontuar frases com vírgula, ponto e vírgula, dois-pontos e outros sinais.",x:"A vírgula separa itens, chama alguém, isola o aposto e separa orações adverbiais deslocadas.",e:"Quando cheguei, todos já tinham saído."},
f7por4:{p:[["Gêneros jornalísticos", "A notícia informa um fato recente. A reportagem aprofunda com dados e depoimentos. A entrevista traz perguntas e respostas.", "“Prefeitura inaugura ciclovia” é notícia."], ["Gêneros argumentativos", "O artigo de opinião defende um ponto de vista. A resenha crítica avalia uma obra. A carta de reclamação expressa uma queixa.", "“Acredito que…” indica opinião."], ["Humor e crítica", "A charge usa desenho e humor para criticar fatos atuais. A crônica comenta o cotidiano com leveza.", "A charge mostra uma crítica com desenho."], ["Gêneros literários", "O conto narra uma história inventada. O poema usa versos e linguagem poética.", "“A tarde cai em silêncio” é poético."], ["Gêneros de divulgação", "O verbete explica de forma objetiva. A divulgação científica explica ciência para o grande público.", "Eclipse: fenômeno em que um astro oculta outro."]],o:"Identificar gêneros jornalísticos, argumentativos e literários.",h:"Identificar gêneros jornalísticos, argumentativos e literários.",x:"A notícia informa um fato recente. A reportagem aprofunda com dados e depoimentos. A entrevista traz perguntas e respostas.",e:"“Prefeitura inaugura ciclovia” é notícia."},
f7ing0:{p:[["There was e there were", "There was descreve um item no passado e there were descreve vários.", "There was a cat on the roof."], ["Was e were", "Com I, he, she e it usamos was. Com you, we e they usamos were.", "They were at home."], ["Negativa e pergunta", "Was not (wasn't), were not (weren't). Na pergunta, o verbo vem primeiro: Was she happy?", "I wasn't tired."], ["Can e can't", "Can indica capacidade ou permissão. A forma negativa é can't. Na pergunta, Can vem primeiro.", "She can swim."], ["Praticando", "Escolha o verbo olhando o sujeito e se a frase fala do passado.", "Were you late?"]],o:"Usar was/were, there was/were e can/can't.",h:"Usar was/were, there was/were e can/can't.",x:"There was descreve um item no passado e there were descreve vários.",e:"There was a cat on the roof."},
f7ing1:{p:[["Present continuous", "Fala do que está acontecendo agora: sujeito + am/is/are + verbo com -ing.", "I am reading a book."], ["Escolha de am, is e are", "I usa am; he, she e it usam is; you, we e they usam are.", "She is cooking dinner."], ["Formando o -ing", "Em geral, some -ing: play → playing. Se termina em e, tire o e: write → writing. Alguns dobram a consoante: swim → swimming.", "They are swimming."], ["Negativa e pergunta", "Na negativa, use not: She isn't sleeping. Na pergunta, am/is/are vem primeiro: Is she sleeping?", "Are they playing now?"], ["Perguntas com what", "What + am/is/are + sujeito + -ing? pergunta o que alguém está fazendo.", "What are you doing?"]],o:"Usar o present continuous em frases afirmativas, negativas e perguntas.",h:"Usar o present continuous em frases afirmativas, negativas e perguntas.",x:"Fala do que está acontecendo agora: sujeito + am/is/are + verbo com -ing.",e:"I am reading a book."},
f7ing2:{p:[["Profissões", "Engineer é engenheiro, lawyer é advogado, dentist é dentista, farmer é agricultor, chef é cozinheiro e artist é artista.", "Chef é cozinheiro."], ["Países", "Japan é Japão, Germany é Alemanha e Spain é Espanha.", "Spain é Espanha."], ["Alimentos", "Cheese é queijo, rice é arroz, chicken é frango e eggs são ovos.", "Eggs são ovos."], ["Em frases", "Use as palavras novas em frases: My father is a farmer. I eat rice and chicken.", "I like cheese."], ["Como lembrar", "Associe cada palavra a uma imagem e repita em voz alta.", ""]],o:"Reconhecer palavras em inglês: profissões, países e alimentos.",h:"Reconhecer palavras em inglês: profissões, países e alimentos.",x:"Engineer é engenheiro, lawyer é advogado, dentist é dentista, farmer é agricultor, chef é cozinheiro e artist é artista.",e:"Chef é cozinheiro."},
f6mat0:{p:[["Potências", "Potência é uma multiplicação de fatores iguais. 2³ = 2 × 2 × 2 = 8. O número de baixo é a base e o de cima é o expoente.", "5² = 25."], ["Raiz quadrada", "A raiz quadrada de um número é o número que, multiplicado por ele mesmo, dá o resultado.", "A raiz de 49 é 7, porque 7 × 7 = 49."], ["Expressões numéricas", "Resolva na ordem: parênteses, potências e raízes, multiplicações e divisões, e por fim somas e subtrações.", "3 + 4 × 2 = 3 + 8 = 11."], ["Divisibilidade, MMC e MDC", "Um número é divisível por 3 se a soma dos algarismos é múltipla de 3. O MMC é o menor múltiplo comum e o MDC é o maior divisor comum.", "MMC(4, 6) = 12 e MDC(12, 18) = 6."], ["Algarismos romanos", "I = 1, V = 5, X = 10. Letras menores antes de maiores subtraem; depois, somam.", "XIV = 10 + 4 = 14."]],o:"Operar com potências, raízes, expressões, MMC, MDC e algarismos romanos.",h:"Operar com potências, raízes, expressões, MMC, MDC e algarismos romanos.",x:"Potência é uma multiplicação de fatores iguais. 2³ = 2 × 2 × 2 = 8. O número de baixo é a base e o de cima é o expoente.",e:"5² = 25."},
f6mat1:{p:[["Somar e subtrair inteiros", "Somar um negativo é andar para a esquerda na reta. Subtrair um número é somar o seu oposto.", "(−4) − (−6) = −4 + 6 = 2."], ["Multiplicar e dividir", "Sinais iguais dão resultado positivo; sinais diferentes dão resultado negativo.", "(−5) × (−2) = 10 e (−12) ÷ 3 = −4."], ["Módulo", "O módulo de um número é a sua distância até o zero, sempre positiva ou zero.", "|−7| = 7."], ["Comparar e ordenar", "Na reta, quanto mais à direita, maior o número. Na ordem decrescente, vamos do maior para o menor.", "−1 > −5."], ["Problemas", "Em saldos e temperaturas, os negativos indicam dívida ou frio. Monte a conta com os sinais e confira.", "4 − (−3) = 7 graus de diferença."]],o:"Operar, comparar e usar números inteiros em problemas.",h:"Operar, comparar e usar números inteiros em problemas.",x:"Somar um negativo é andar para a esquerda na reta. Subtrair um número é somar o seu oposto.",e:"(−4) − (−6) = −4 + 6 = 2."},
f6mat2:{p:[["Somar com denominadores diferentes", "Para somar ou subtrair, ache o MMC dos denominadores e converta as frações.", "1/2 + 1/3 = 3/6 + 2/6 = 5/6."], ["Multiplicar frações", "Multiplique numerador com numerador e denominador com denominador. Se possível, simplifique.", "1/2 × 3/4 = 3/8."], ["Dividir frações", "Dividir é multiplicar pelo inverso da segunda fração.", "1/2 ÷ 1/4 = 1/2 × 4 = 2."], ["Números mistos", "Um número misto vira fração imprópria multiplicando o inteiro pelo denominador e somando o numerador.", "3 2/5 = 17/5."], ["Comparar e resolver problemas", "Para comparar frações, use o mesmo denominador. Em problemas, descubra a operação que a história pede.", "3/5 = 9/15 e 2/3 = 10/15, então 2/3 é maior."]],o:"Operar e comparar frações com denominadores diferentes.",h:"Operar e comparar frações com denominadores diferentes.",x:"Para somar ou subtrair, ache o MMC dos denominadores e converta as frações.",e:"1/2 + 1/3 = 3/6 + 2/6 = 5/6."},
f6mat3:{p:[["Multiplicar decimais", "Multiplique como se não houvesse vírgula e, no fim, conte as casas decimais dos dois fatores.", "0,3 × 0,3 = 0,09."], ["Dividir decimais", "Divida normalmente e coloque a vírgula no lugar certo. Podemos multiplicar dividendo e divisor por 10 para eliminar a vírgula.", "1,5 ÷ 0,5 = 15 ÷ 5 = 3."], ["Arredondar", "Olhe o algarismo seguinte: 5 ou mais, sobe; menos que 5, fica.", "4,67 vira 4,7."], ["Unidades de medida", "1 km = 1000 m, 1 kg = 1000 g, 1 L = 1000 mL e 1 m = 100 cm.", "3,5 km = 3500 m."], ["Fração, decimal e porcentagem", "Os três são formas de escrever a mesma quantidade: 3/4 = 0,75 = 75%.", "1/5 = 0,2 = 20%."]],o:"Operar com decimais e converter medidas e formas de escrita.",h:"Operar com decimais e converter medidas e formas de escrita.",x:"Multiplique como se não houvesse vírgula e, no fim, conte as casas decimais dos dois fatores.",e:"0,3 × 0,3 = 0,09."},
f6mat4:{p:[["O que é porcentagem", "Porcentagem é uma fração de denominador 100. 25% quer dizer 25 em cada 100.", "25% = 25/100 = 1/4."], ["Calcular uma porcentagem", "Multiplique a fração pela quantidade: p% de n = p/100 × n.", "10% de 150 = 15."], ["Desconto e acréscimo", "No desconto, subtraia a porcentagem do preço. No acréscimo, some.", "R$ 80 com 25% de desconto: 80 − 20 = 60."], ["Descobrir o percentual", "Divida a parte pelo total e escreva em porcentagem.", "40 de 50 é 40/50 = 80%."], ["Descobrir o total", "Se 10% vale 7, então 100% vale 10 vezes mais.", "10% = 7, então 100% = 70."]],o:"Calcular porcentagens, descontos, acréscimos e percentuais.",h:"Calcular porcentagens, descontos, acréscimos e percentuais.",x:"Porcentagem é uma fração de denominador 100. 25% quer dizer 25 em cada 100.",e:"25% = 25/100 = 1/4."},
f6mat7:{p:[["Ângulos", "Ângulo reto mede 90°, agudo é menor que 90°, obtuso fica entre 90° e 180° e raso mede 180°. Complementares somam 90° e suplementares somam 180°.", "O complemento de 30° é 60°."], ["Polígonos", "Polígonos são figuras fechadas com lados retos: pentágono (5 lados), hexágono (6), octógono (8), decágono (10).", "Hexágono: 6 lados."], ["Triângulos", "A soma dos ângulos de um triângulo é 180°. Equilátero tem 3 lados iguais, isósceles tem 2 e escaleno não tem lados iguais.", "Isósceles: 2 lados iguais."], ["Quadriláteros", "A soma dos ângulos de um quadrilátero é 360°. O quadrado tem lados iguais e ângulos retos; o trapézio tem só um par de lados paralelos.", "Quadrado: 4 lados iguais e 4 ângulos retos."], ["Perímetro, área e simetria", "Perímetro é a soma dos lados. Área do retângulo = base × altura e do triângulo = base × altura ÷ 2. Eixos de simetria dividem a figura em partes iguais.", "Quadrado de lado 6: perímetro 24 e área 36."]],o:"Reconhecer figuras geométricas e calcular perímetro e área.",h:"Reconhecer figuras geométricas e calcular perímetro e área.",x:"Ângulo reto mede 90°, agudo é menor que 90°, obtuso fica entre 90° e 180° e raso mede 180°. Complementares somam 90° e suplementares somam 180°.",e:"O complemento de 30° é 60°."},
f6por0:{p:[["Ler com atenção", "Em textos curtos, leia tudo e perceba o assunto, o ambiente e os sentimentos.", "“Mariana acordou antes do despertador.”"], ["Sentimentos", "Pistas como mal dormiu, ansiedade, cabisbaixo e aplaudiram mostram o que os personagens sentem.", "“Cabisbaixo” indica tristeza."], ["Ambiente e cena", "Observe onde e quando a cena acontece e o que se vê ou se ouve.", "A biblioteca estava em silêncio."], ["Causa e informação", "Procure no texto o motivo (por que) e os detalhes (quem, o quê, como).", "Mal dormiu porque estava ansiosa."], ["Título e vocabulário", "O título combina com o assunto principal. Para entender uma palavra nova, use o contexto da frase.", "“Cabisbaixo”: de cabeça baixa."]],o:"Interpretar textos: sentimentos, ambiente, causas e título.",h:"Interpretar textos: sentimentos, ambiente, causas e título.",x:"Em textos curtos, leia tudo e perceba o assunto, o ambiente e os sentimentos.",e:"“Mariana acordou antes do despertador.”"},
f6por1:{p:[["As dez classes", "Substantivo, adjetivo, verbo, advérbio, preposição, conjunção, interjeição, numeral, pronome e artigo.", "“A menina corre rápido.”"], ["Preposição e conjunção", "A preposição liga palavras (de, em, para, sobre). A conjunção liga orações ou palavras (e, mas, ou, porque).", "Gosto de chocolate, mas prefiro fruta."], ["Interjeição e numeral", "A interjeição expressa emoção (Ufa! Oba!). O numeral indica quantidade ou ordem (dois, primeiro).", "Oba! Chegou o recreio."], ["Advérbio e pronome", "O advérbio indica modo, tempo ou lugar (cedo, nunca, perto). O pronome substitui ou acompanha um nome (ele, meus, este).", "Ele chegou cedo."], ["Substantivo e adjetivo", "O substantivo dá nome a seres e coisas. O adjetivo diz como são.", "vestido elegante."]],o:"Reconhecer as dez classes de palavras.",h:"Reconhecer as dez classes de palavras.",x:"Substantivo, adjetivo, verbo, advérbio, preposição, conjunção, interjeição, numeral, pronome e artigo.",e:"“A menina corre rápido.”"},
f6por2:{p:[["Palavras com SS, C, Ç, SC e XC", "O som de s se escreve de várias formas: sucesso, necessário, descer, crescer, exceção.", "Descer e crescer têm SC."], ["Palavras com S e Z", "S entre vogais pode ter som de z: emoção, ambiente. Observe a família da palavra para escolher.", "Emoção tem S e Ç."], ["G e J", "Escreve-se g antes de e e i em muitas palavras (bagagem, massagem, ginástica) e j em outras (jeito).", "Ginástica começa com G."], ["Acentos", "Palavras como precipício, silêncio, paraíso, vigilância e necessário levam acento.", "Silêncio leva acento."], ["Como treinar", "Leia, cubra, escreva de memória e confira. Anote as palavras que mais erra.", ""]],o:"Escrever corretamente palavras com s/ss/c/ç/sc/xc, g/j e acentos.",h:"Escrever corretamente palavras com s/ss/c/ç/sc/xc, g/j e acentos.",x:"O som de s se escreve de várias formas: sucesso, necessário, descer, crescer, exceção.",e:"Descer e crescer têm SC."},
f6por3:{p:[["Vírgula", "A vírgula separa itens, chama alguém, isola expressões como “ontem” no começo e separa orações como “se chover”.", "Se chover, não iremos."], ["Dois-pontos", "Os dois-pontos aparecem antes de uma explicação, de uma lista ou de uma fala.", "Tenho dois irmãos: Ana e Léo."], ["Travessão", "O travessão mostra a fala de um personagem em um diálogo.", "— Quer ajuda? perguntou o menino."], ["Reticências", "As reticências mostram dúvida, suspense ou uma frase que não terminou.", "Será que ela vem…"], ["Sinais finais", "O ponto final conta algo, a interrogação pergunta e a exclamação mostra emoção.", "Que prova difícil!"]],o:"Usar vírgula, dois-pontos, travessão, reticências e sinais finais.",h:"Usar vírgula, dois-pontos, travessão, reticências e sinais finais.",x:"A vírgula separa itens, chama alguém, isola expressões como “ontem” no começo e separa orações como “se chover”.",e:"Se chover, não iremos."},
f6por4:{p:[["Gêneros que narram", "O mito explica a origem das coisas com deuses. A fábula tem animais e uma moral. A crônica comenta o dia a dia de forma leve. O relato pessoal conta a experiência do autor.", "“Era uma vez…” abre uma história."], ["Gêneros que informam", "A reportagem aprofunda um fato com dados e depoimentos. A divulgação científica explica ciência de forma acessível. A biografia conta a vida de uma pessoa.", "Reportagem: dados e depoimentos."], ["Gêneros que opinam e convencem", "O artigo de opinião defende um ponto de vista com argumentos. O cartaz de campanha orienta o público a agir.", "“Doe sangue. Salve vidas!” é cartaz de campanha."], ["Entrevista, receita e poema", "A entrevista tem perguntas e respostas. A receita ensina em etapas. O poema usa versos e linguagem poética.", "— Quando você começou? — Aos oito anos."], ["Como reconhecer", "Observe a finalidade, quem fala, como o texto começa e que palavras usa.", "“Bata os ovos” é de uma receita."]],o:"Reconhecer gêneros textuais e suas características.",h:"Reconhecer gêneros textuais e suas características.",x:"O mito explica a origem das coisas com deuses. A fábula tem animais e uma moral. A crônica comenta o dia a dia de forma leve. O relato pessoal conta a experiência do autor.",e:"“Era uma vez…” abre uma história."},
f6his0:{p:[["O sistema colonial", "Pelo pacto colonial, a colônia só podia vender e comprar da metrópole. O mercantilismo defendia acumular metais preciosos.", "O comércio era exclusivo de Portugal."], ["Capitanias e Governo-Geral", "Em 1534, as capitanias hereditárias foram entregues a donatários. Em 1549, o Governo-Geral, com Tomé de Sousa, centralizou a administração.", "Salvador foi a primeira capital."], ["Economia e sociedade", "Engenhos de açúcar, gado, mineração e algodão sustentaram a colônia. O trabalho era feito por pessoas escravizadas.", "O quinto era cobrado nas casas de fundição."], ["Conflitos e resistências", "Houve Palmares (Zumbi), Emboabas, Mascates, Conjuração Baiana e Inconfidência Mineira (1789), que queria se libertar de Portugal.", "“Libertas quae sera tamen”: liberdade, ainda que tardia."], ["Cultura e religião", "Os jesuítas catequizavam e educavam. O barroco marcou as igrejas, e Aleijadinho foi o grande escultor mineiro.", "Aleijadinho: Antônio Francisco Lisboa."]],o:"Compreender o sistema colonial, a economia, a sociedade e os conflitos.",h:"Compreender o sistema colonial, a economia, a sociedade e os conflitos.",x:"Pelo pacto colonial, a colônia só podia vender e comprar da metrópole. O mercantilismo defendia acumular metais preciosos.",e:"O comércio era exclusivo de Portugal."},
f6his1:{p:[["A corte no Brasil", "Em 1808, a corte portuguesa chegou ao Rio de Janeiro. A Abertura dos Portos acabou com o monopólio de Portugal.", "Abertura dos Portos: 1808."], ["O caminho da independência", "A Revolução do Porto (1820) quis recolonizar o Brasil. O Fico (9/1/1822) e o “Cumpra-se” reforçaram a autoridade de Dom Pedro.", "Dom Pedro decidiu ficar."], ["7 de setembro", "Em 7 de setembro de 1822, às margens do Ipiranga, em São Paulo, Dom Pedro declarou a independência. Foi coroado imperador em dezembro.", "Independência ou Morte!"], ["Reconhecimento e Constituição", "Portugal reconheceu a independência em 1825, mediante indenização. A Constituição de 1824 foi outorgada e criou o Poder Moderador.", "O voto era censitário."], ["Lutas e Regência", "Houve lutas na Bahia (2 de julho de 1823), com Maria Quitéria e Maria Felipa. Em 1831, Pedro I abdicou e o país foi governado por regentes.", "Período Regencial: 1831 a 1840."]],o:"Compreender as causas, os fatos e as consequências da Independência.",h:"Compreender as causas, os fatos e as consequências da Independência.",x:"Em 1808, a corte portuguesa chegou ao Rio de Janeiro. A Abertura dos Portos acabou com o monopólio de Portugal.",e:"Abertura dos Portos: 1808."},
f6geo0:{p:[["Escala", "A escala compara o mapa com a realidade. Em 1:100.000, 1 cm no mapa são 100.000 cm, ou 1 km.", "1:100.000 e 5 cm: 5 km."], ["Coordenadas", "Latitude (N/S do Equador) e longitude (L/O de Greenwich) localizam qualquer ponto. Eles definem os hemisférios.", "23° S e 46° O: sul e ocidental."], ["Fusos horários", "A Terra tem 24 fusos de 15° cada. Para oeste de Greenwich, as horas diminuem.", "12h em Greenwich = 9h três fusos a oeste."], ["Relevo, projeções e satélites", "Curvas de nível mostram a altitude. Toda projeção distorce, e a de Mercator exagera as áreas polares. Imagens de satélite mostram o terreno de cima.", "Curvas juntas: terreno íngreme."], ["Tipos de mapas e orientação", "Há mapas políticos, físicos, temáticos, rodoviários e hidrográficos. A rosa dos ventos tem 4 cardeais e 4 colaterais.", "Sudoeste: entre sul e oeste."]],o:"Usar escala, coordenadas, fusos, projeções e tipos de mapa.",h:"Usar escala, coordenadas, fusos, projeções e tipos de mapa.",x:"A escala compara o mapa com a realidade. Em 1:100.000, 1 cm no mapa são 100.000 cm, ou 1 km.",e:"1:100.000 e 5 cm: 5 km."},
f6geo1:{p:[["Fatores do clima", "Latitude, altitude, maritimidade, continentalidade, correntes marítimas e massas de ar influenciam o clima.", "A cada 100 m de altitude, cai cerca de 0,6 °C."], ["Climas do mundo", "Equatorial: quente e úmido. Tropical: estação chuvosa e seca. Desértico: muito seco. Temperado: quatro estações. Polar: muito frio.", "Amazônia: clima equatorial."], ["Fenômenos", "O El Niño aquece as águas do Pacífico. A inversão térmica prende a poluição. A ilha de calor aquece as cidades. A chuva ácida vem de poluentes.", "Inversão térmica: ar frio preso perto do chão."], ["Ciclo da água", "Evaporação, condensação, precipitação e infiltração mantêm a água em circulação.", "O vapor vira nuvem por condensação."], ["Gráficos e mudanças", "O climograma mostra chuva (barras) e temperatura (linha). O excesso de CO₂ intensifica o efeito estufa.", "Climograma: chuva e temperatura."]],o:"Compreender os fatores do clima, os climas do mundo e os fenômenos climáticos.",h:"Compreender os fatores do clima, os climas do mundo e os fenômenos climáticos.",x:"Latitude, altitude, maritimidade, continentalidade, correntes marítimas e massas de ar influenciam o clima.",e:"A cada 100 m de altitude, cai cerca de 0,6 °C."},
f6geo3:{p:[["Formas de relevo", "Planície é baixa e plana, planalto é elevado, montanha é uma grande elevação, cordilheira é um conjunto de montanhas e depressão é um terreno rebaixado.", "Os Andes são uma cordilheira."], ["O relevo do Brasil", "No Brasil predominam planaltos. O Pico da Neblina é o ponto mais alto. A Planície Amazônica é baixa, com muitos rios.", "Pico da Neblina: cerca de 2 995 m."], ["Agentes internos", "A tectônica de placas, os terremotos e os vulcões modelam o relevo. O Brasil fica no centro de uma placa e tem poucos terremotos.", "Terremotos: bordas das placas."], ["Agentes externos", "O intemperismo quebra as rochas e a erosão leva o material. Água, vento e gelo são agentes. A vegetação protege o solo.", "Terraços ajudam contra a erosão."], ["Rochas e solo", "Ígneas vêm do magma (granito), sedimentares vêm de sedimentos compactados (arenito) e metamórficas vêm da transformação (mármore). O solo vem de rochas decompostas e húmus.", "Granito: rocha ígnea."]],o:"Reconhecer formas de relevo, agentes de modelagem, rochas e solo.",h:"Reconhecer formas de relevo, agentes de modelagem, rochas e solo.",x:"Planície é baixa e plana, planalto é elevado, montanha é uma grande elevação, cordilheira é um conjunto de montanhas e depressão é um terreno rebaixado.",e:"Os Andes são uma cordilheira."},
f6cie0:{p:[["Camadas da Terra", "A Terra tem crosta, manto e núcleo. A crosta é a camada mais externa e fina; o núcleo é de ferro e níquel.", "Vivemos na crosta."], ["As esferas da Terra", "A litosfera é a parte sólida, a hidrosfera é a água, a atmosfera é o ar e a biosfera é o conjunto dos seres vivos.", "Hidro quer dizer água."], ["Atmosfera", "O ar tem cerca de 78% de nitrogênio. A camada de ozônio nos protege dos raios ultravioleta.", "O ozônio absorve a radiação ultravioleta."], ["Sol, distâncias e universo", "O Sol gera energia por fusão nuclear. A UA e o ano-luz medem distâncias. O universo começou, segundo a teoria mais aceita, com o Big Bang.", "1 ano-luz é uma distância."], ["Marés, estações e exploração", "A Lua e o Sol causam as marés. A inclinação de 23,5° do eixo cria as estações. O Sputnik 1 (1957) foi o primeiro satélite artificial.", "Equinócio: dia e noite iguais."]],o:"Compreender a estrutura da Terra, as esferas terrestres, o Sol e o universo.",h:"Compreender a estrutura da Terra, as esferas terrestres, o Sol e o universo.",x:"A Terra tem crosta, manto e núcleo. A crosta é a camada mais externa e fina; o núcleo é de ferro e níquel.",e:"Vivemos na crosta."},
f6cie1:{p:[["Estados e mudanças de estado", "Sólido, líquido e gasoso mudam por fusão, solidificação, vaporização, condensação e sublimação. A água congela a 0 °C e ferve a 100 °C.", "Gelo vira água por fusão."], ["Misturas", "A mistura homogênea tem uma só fase (água com sal). A heterogênea tem mais de uma (água com areia).", "Água com areia: heterogênea."], ["Separação de misturas", "Filtração, decantação, evaporação, catação, peneiração e separação magnética separam os componentes.", "O ímã separa o ferro da areia."], ["Transformações", "Na transformação física não surgem novas substâncias (derreter gelo). Na química, surgem (queimar papel, enferrujar).", "A ferrugem é uma transformação química."], ["Calor, temperatura e energia", "Calor passa do corpo mais quente para o mais frio. Metais conduzem calor e o isopor isola. Sol, vento e água são fontes renováveis.", "Energia solar: renovável."]],o:"Reconhecer estados da matéria, misturas, transformações e fontes de energia.",h:"Reconhecer estados da matéria, misturas, transformações e fontes de energia.",x:"Sólido, líquido e gasoso mudam por fusão, solidificação, vaporização, condensação e sublimação. A água congela a 0 °C e ferve a 100 °C.",e:"Gelo vira água por fusão."},
f6cie2:{p:[["O sistema nervoso", "O sistema nervoso é formado por encéfalo, medula espinhal e nervos. O cerebelo controla o equilíbrio e a coordenação.", "A coluna protege a medula."], ["Reflexos", "Reflexo é uma resposta rápida e involuntária, como tirar a mão de algo quente.", "Reflexo: sem pensar."], ["Os sentidos", "A retina forma a imagem, a pupila regula a luz, a cóclea transforma o som em sinais, o nariz sente cheiros, a língua sente sabores e a pele sente o toque.", "Sabores básicos: doce, salgado, azedo e amargo."], ["Hormônios", "O sistema endócrino produz hormônios. A adrenalina prepara o corpo para o perigo e a insulina, do pâncreas, controla o açúcar no sangue.", "Medo: o coração acelera."], ["Cuidados", "Dormir bem, evitar cigarro, álcool e outras drogas e cuidar da saúde mental, pedindo ajuda quando preciso, protegem o corpo e a mente.", "Dormir ajuda a fixar o que aprendemos."]],o:"Compreender o sistema nervoso, os sentidos, os hormônios e os cuidados com a saúde.",h:"Compreender o sistema nervoso, os sentidos, os hormônios e os cuidados com a saúde.",x:"O sistema nervoso é formado por encéfalo, medula espinhal e nervos. O cerebelo controla o equilíbrio e a coordenação.",e:"A coluna protege a medula."},
f6cie3:{p:[["Fatores bióticos e abióticos", "Os fatores bióticos são os seres vivos. Os abióticos são os elementos sem vida: luz, água, solo e temperatura.", "Temperatura: fator abiótico."], ["Cadeias e pirâmide de energia", "Produtores, consumidores primários, secundários e decompositores formam as cadeias. A energia diminui a cada nível da pirâmide.", "Os produtores têm mais energia."], ["Relações ecológicas", "Mutualismo: os dois ganham. Parasitismo: um ganha e o outro perde. Predação: um caça o outro. Competição: disputa por recursos.", "Abelha e flor: mutualismo."], ["Ciclos e problemas ambientais", "As plantas absorvem CO₂, e a queima de combustíveis o libera. Queimadas destroem habitats e poluem. O plástico prejudica a vida marinha.", "A fotossíntese retira CO₂ do ar."], ["Biodiversidade e sustentabilidade", "O Brasil é megadiverso, e a Amazônia tem a maior biodiversidade. Espécie endêmica só existe em um lugar. Consumir menos e fazer compostagem ajudam.", "A compostagem vira adubo."]],o:"Compreender relações ecológicas, ciclos, biodiversidade e sustentabilidade.",h:"Compreender relações ecológicas, ciclos, biodiversidade e sustentabilidade.",x:"Os fatores bióticos são os seres vivos. Os abióticos são os elementos sem vida: luz, água, solo e temperatura.",e:"Temperatura: fator abiótico."},
f6ing0:{p:[["There is e there are", "Usamos there is para um item e there are para vários itens. Eles indicam que algo existe em algum lugar.", "There is a book on the table."], ["There are", "Com plural, usamos there are.", "There are two cats in the garden."], ["Adjetivos possessivos", "My (meu), your (seu), his (dele), her (dela), our (nosso) e their (deles) mostram a quem algo pertence.", "Her cat is white."], ["To be: negativa e pergunta", "Na negativa, colocamos not: She is not a teacher. Na pergunta, o verbo vem primeiro: Are you a student?", "Is he your brother?"], ["Praticando", "Escolha o verbo olhando quem fala: I am, he/she/it is, you/we/they are.", "I am not tired."]],o:"Usar there is/are, adjetivos possessivos e o verbo to be.",h:"Usar there is/are, adjetivos possessivos e o verbo to be.",x:"Usamos there is para um item e there are para vários itens. Eles indicam que algo existe em algum lugar.",e:"There is a book on the table."},
f6ing1:{p:[["Present simple", "O present simple fala de rotina e de fatos. Com he, she e it, o verbo ganha s (ou es).", "He watches TV every night."], ["Negativa e pergunta", "Na negativa, usamos don't ou doesn't. Na pergunta, usamos do ou does, e o verbo fica sem s.", "Does she like pizza?"], ["Advérbios de frequência", "Always (sempre), usually (geralmente), sometimes (às vezes) e never (nunca) ficam antes do verbo principal.", "She always eats breakfast."], ["Perguntas com where e what time", "Where does she live? What time do you wake up? Do ou does vêm depois da palavra de pergunta.", "What time do you wake up?"], ["Respostas curtas", "Respondemos com do ou does: Yes, she does. No, they don't.", "Do they play soccer? No, they don't."]],o:"Usar o present simple em frases afirmativas, negativas, perguntas e respostas curtas.",h:"Usar o present simple em frases afirmativas, negativas, perguntas e respostas curtas.",x:"O present simple fala de rotina e de fatos. Com he, she e it, o verbo ganha s (ou es).",e:"He watches TV every night."},
f6ing2:{p:[["Meses", "May é maio, August é agosto e December é dezembro.", "August é agosto."], ["Família", "Grandmother é avó, uncle é tio e cousin é primo.", "Uncle é tio."], ["Lugares", "Library é biblioteca e supermarket é supermercado.", "Library é biblioteca."], ["Corpo", "Head é cabeça, arm é braço e leg é perna.", "Arm é braço."], ["Sentimentos", "Happy é feliz e sad é triste.", "Happy é feliz."]],o:"Reconhecer palavras simples em inglês.",h:"Reconhecer palavras simples em inglês.",x:"May é maio, August é agosto e December é dezembro.",e:"August é agosto."},
f5mat0:{p:[["Números maiores", "Podemos ler e escrever números com seis ordens, até a centena de milhar. Cada algarismo vale pela posição que ocupa.", "No 482 150, o 8 vale 80 000."], ["Comparar e arredondar", "Compare da esquerda para a direita. Para arredondar à centena, olhe a dezena: 5 ou mais sobe, menos que 5 fica.", "348 arredonda para 300."], ["Múltiplos e divisores", "Múltiplos de um número são os resultados da sua tabuada: 6, 12, 18... Divisores são os números que dividem sem deixar resto.", "42 é múltiplo de 6. 8 é divisor de 24."], ["Números primos", "Um número primo só pode ser dividido por 1 e por ele mesmo. O 2 é o único primo par.", "13 e 17 são primos."], ["Resolver problemas", "Leia, escolha a operação e confira: some para juntar, subtraia para tirar, multiplique grupos iguais e divida para repartir.", "360 ÷ 6 = 60."]],o:"Ler, comparar e operar com números naturais maiores, múltiplos, divisores e primos.",h:"Ler, comparar e operar com números naturais maiores, múltiplos, divisores e primos.",x:"Podemos ler e escrever números com seis ordens, até a centena de milhar. Cada algarismo vale pela posição que ocupa.",e:"No 482 150, o 8 vale 80 000."},
f5mat1:{p:[["Números inteiros", "Os números inteiros incluem os positivos, o zero e os negativos. Os negativos mostram, por exemplo, temperaturas abaixo de zero e dívidas.", "−3 °C é uma temperatura abaixo de zero."], ["A reta numérica", "Na reta, os positivos ficam à direita do zero e os negativos à esquerda. Quanto mais à direita, maior o número.", "−1 é maior que −5."], ["Oposto de um número", "O oposto de um número tem o mesmo valor, mas o sinal contrário. A soma de um número com o seu oposto é zero.", "O oposto de 7 é −7."], ["Comparar e ordenar", "Todo positivo é maior que qualquer negativo. Entre dois negativos, o que está mais perto do zero é o maior.", "−2 é maior que −7."], ["Situações do dia a dia", "Para achar um saldo ou uma temperatura, ande na reta: para a direita ao somar e para a esquerda ao subtrair.", "5 − 8 = −3."]],o:"Reconhecer, comparar e operar com números inteiros.",h:"Reconhecer, comparar e operar com números inteiros.",x:"Os números inteiros incluem os positivos, o zero e os negativos. Os negativos mostram, por exemplo, temperaturas abaixo de zero e dívidas.",e:"−3 °C é uma temperatura abaixo de zero."},
f5mat2:{p:[["Mesmo denominador", "Para somar ou subtrair frações com o mesmo denominador, opere só com os numeradores e mantenha o denominador.", "2/9 + 4/9 = 6/9."], ["Fração de uma quantidade", "Divida a quantidade pelo denominador e multiplique pelo numerador.", "3/5 de 40: 40 ÷ 5 = 8 e 8 × 3 = 24."], ["Simplificar frações", "Dividindo numerador e denominador pelo mesmo número, achamos uma fração equivalente mais simples.", "4/8 = 1/2."], ["Comparar frações", "Com o mesmo numerador, a fração de menor denominador é maior. Também podemos pensar em quanto cada fração vale.", "1/2 é maior que 1/3."], ["Frações impróprias e números mistos", "Se o numerador é maior que o denominador, a fração é imprópria e pode virar número misto.", "7/4 = 1 3/4."]],o:"Operar, comparar e simplificar frações.",h:"Operar, comparar e simplificar frações.",x:"Para somar ou subtrair frações com o mesmo denominador, opere só com os numeradores e mantenha o denominador.",e:"2/9 + 4/9 = 6/9."},
f5mat3:{p:[["Casas decimais", "Depois da vírgula temos décimos, centésimos e milésimos. Cada casa vale dez vezes menos que a anterior.", "Em 4,356, o 5 são 5 centésimos."], ["Comparar e operar", "Compare a parte inteira e depois cada casa decimal. Para somar e subtrair, alinhe as vírgulas.", "2,35 + 1,40 = 3,75."], ["Por 10, 100 e 1000", "Multiplicar por 10, 100 ou 1000 move a vírgula para a direita. Dividir move a vírgula para a esquerda.", "3,45 × 10 = 34,5."], ["Porcentagem", "Porcentagem é uma fração de 100. 50% é a metade, 25% é um quarto e 10% é um décimo.", "25% de 40 = 10."], ["Medidas", "1 m tem 100 cm e 1 kg tem 1000 g. Para passar de metros para centímetros, multiplicamos por 100.", "1,5 m = 150 cm."]],o:"Ler, comparar e operar com decimais, porcentagens e medidas.",h:"Ler, comparar e operar com decimais, porcentagens e medidas.",x:"Depois da vírgula temos décimos, centésimos e milésimos. Cada casa vale dez vezes menos que a anterior.",e:"Em 4,356, o 5 são 5 centésimos."},
f5por0:{p:[["Ler e entender", "Em textos maiores, leia tudo e pense: o que aconteceu, por que aconteceu e o que veio depois.", "“Choveu forte a noite toda. De manhã, o rio subiu.”"], ["Causa", "A causa é o motivo de algo acontecer. Procure palavras como porque, pois e por causa de.", "O rio subiu porque choveu forte."], ["Consequência", "A consequência é o resultado. Palavras como por isso, então e assim mostram a consequência.", "As ruas ficaram alagadas."], ["Assunto e título", "O título combina com o assunto principal: aquilo de que o texto mais fala.", "“A chuva e o rio” é um bom título."], ["Confira no texto", "Se esquecer a resposta, releia e confira no texto. A resposta sempre está nele.", ""]],o:"Identificar causa, consequência e assunto em um texto.",h:"Identificar causa, consequência e assunto em um texto.",x:"Em textos maiores, leia tudo e pense: o que aconteceu, por que aconteceu e o que veio depois.",e:"“Choveu forte a noite toda. De manhã, o rio subiu.”"},
f5por1:{p:[["Pronomes", "O pronome substitui ou acompanha um nome: eu, tu, ele, ela, nós, vocês, eles.", "“Ela comprou um livro.”"], ["Advérbios", "O advérbio indica modo, tempo ou lugar: rapidamente, cedo, hoje, aqui.", "Ele correu rapidamente."], ["Tempos do verbo", "O verbo muda de tempo: passado (estudei), presente (estudo) e futuro (estudarei).", "Ontem estudei, hoje estudo, amanhã estudarei."], ["Plural e feminino", "Para o plural usamos s, es, ães, ais... Para o feminino mudamos a terminação: menino → menina, leão → leoa.", "pão → pães; professor → professora."], ["Próprio e comum", "O substantivo próprio dá nome específico e começa com maiúscula. O comum nomeia coisas em geral.", "Brasil é próprio; cidade é comum."]],o:"Reconhecer pronomes, advérbios, tempos verbais, plural e feminino.",h:"Reconhecer pronomes, advérbios, tempos verbais, plural e feminino.",x:"O pronome substitui ou acompanha um nome: eu, tu, ele, ela, nós, vocês, eles.",e:"“Ela comprou um livro.”"},
f5por2:{p:[["Palavras com H", "O h no começo das palavras não tem som, mas precisa ser escrito: hotel, horta, humor, hábito, herói, história.", "Hotel começa com H."], ["X e Ç", "O x pode ter vários sons: texto, explicar, máximo. O ç aparece antes de a, o e u: preguiça, cabeça.", "Preguiça tem Ç."], ["G ou J", "O som de j se escreve com g antes de e e i (gelatina, gíria) e com j em jeito.", "Gelatina tem G; jeito tem J."], ["Acentos", "Palavras como através, exército, análise e direção levam acento ou til. Sem eles, a palavra fica errada.", "Análise leva acento."], ["Como treinar", "Leia, cubra a palavra, escreva de memória e confira. Repita até acertar.", ""]],o:"Escrever corretamente palavras com h, x, ç, g/j e acentos.",h:"Escrever corretamente palavras com h, x, ç, g/j e acentos.",x:"O h no começo das palavras não tem som, mas precisa ser escrito: hotel, horta, humor, hábito, herói, história.",e:"Hotel começa com H."},
f5por3:{p:[["A pontuação", "Os sinais de pontuação organizam o texto e mostram como ler. Cada um tem uma função.", "Compare: “Vamos comer, Ana.” e “Vamos comer Ana.”"], ["Vírgula", "A vírgula separa itens de uma lista, chama alguém e vem antes de “mas”.", "Eu quis ir, mas chovia."], ["Dois-pontos", "Os dois-pontos aparecem antes de uma lista, de uma fala ou de uma explicação.", "Tenho três irmãos: Ana, Léo e Bia."], ["Travessão", "O travessão mostra a fala de um personagem em um diálogo.", "— Você viu meu caderno? perguntou Léo."], ["Reticências e sinais finais", "As reticências mostram dúvida ou suspense. O ponto final conta algo, a interrogação pergunta e a exclamação mostra emoção.", "Quem sabe…"]],o:"Escolher o sinal de pontuação adequado.",h:"Escolher o sinal de pontuação adequado.",x:"Os sinais de pontuação organizam o texto e mostram como ler. Cada um tem uma função.",e:"Compare: “Vamos comer, Ana.” e “Vamos comer Ana.”"},
f5por4:{p:[["Gêneros que informam", "A notícia informa um fato recente. A reportagem aprofunda um assunto com depoimentos e dados. A divulgação científica explica ciência em linguagem simples.", "“Equipe da escola ganha torneio” é uma notícia."], ["Gêneros que narram", "O conto narra uma história inventada. A crônica conta fatos do dia a dia com leveza. A biografia conta a vida de uma pessoa. O diário registra o que se viveu, em primeira pessoa.", "“Querido diário” abre um diário."], ["Gêneros que ensinam e regulam", "O texto instrucional explica passo a passo. O regulamento apresenta regras em itens ou artigos.", "“Para montar: 1) abra a caixa” é instrucional."], ["Gêneros que opinam e convencem", "A resenha avalia uma obra. A carta do leitor opina em um jornal. A propaganda tenta convencer a comprar.", "“Compre o creme Sorriso!” é propaganda."], ["Gênero que rima", "O cordel é um poema popular em versos rimados, muitas vezes vendido em folhetos.", "“História, valente, gente” rimam."]],o:"Reconhecer gêneros textuais e suas funções.",h:"Reconhecer gêneros textuais e suas funções.",x:"A notícia informa um fato recente. A reportagem aprofunda um assunto com depoimentos e dados. A divulgação científica explica ciência em linguagem simples.",e:"“Equipe da escola ganha torneio” é uma notícia."},
f5his0:{p:[["Tordesilhas e engenhos", "Em 1494, o Tratado de Tordesilhas dividiu as terras novas entre Portugal e Espanha. Nos engenhos, a casa-grande era a moradia do senhor e a senzala, a das pessoas escravizadas.", "A cana era moída na moenda."], ["Holandeses no Nordeste", "No século XVII, os holandeses invadiram o Nordeste, principalmente Pernambuco, para controlar o açúcar.", "Eles ficaram de 1630 a 1654."], ["O ciclo do ouro", "No século XVIII, o ouro de Minas Gerais enriqueceu a colônia. Portugal cobrava o quinto e, às vezes, a derrama.", "O quinto era 20% do ouro."], ["Fronteiras e capital", "Os bandeirantes ampliaram o território. O Tratado de Madri (1750) acertou os limites. O Marquês de Pombal expulsou os jesuítas em 1759. Em 1763, a capital passou de Salvador para o Rio de Janeiro.", "Rio de Janeiro: capital desde 1763."], ["Resistências e Inconfidência", "Zumbi liderou o quilombo de Palmares e morreu em 1695. Em 1789, a Inconfidência Mineira protestou contra os impostos; Tiradentes foi executado em 1792.", "Em 20 de novembro lembramos Zumbi."]],o:"Conhecer a organização, a economia e a sociedade do Brasil colonial.",h:"Conhecer a organização, a economia e a sociedade do Brasil colonial.",x:"Em 1494, o Tratado de Tordesilhas dividiu as terras novas entre Portugal e Espanha. Nos engenhos, a casa-grande era a moradia do senhor e a senzala, a das pessoas escravizadas.",e:"A cana era moída na moenda."},
f5his1:{p:[["A corte no Brasil", "Em 1808, fugindo de Napoleão, a família real portuguesa chegou ao Brasil e se instalou no Rio de Janeiro. Dom João abriu os portos e criou a Imprensa Régia.", "A Abertura dos Portos liberou o comércio."], ["Reino Unido", "Em 1815, o Brasil foi elevado a Reino Unido a Portugal e Algarves e deixou de ser colônia.", "Brasil: reino em 1815."], ["O caminho da independência", "Em 1821, Dom João VI voltou a Portugal e as Cortes quiseram recolonizar o Brasil. Em 9 de janeiro de 1822, no Dia do Fico, Dom Pedro decidiu ficar.", "Dia do Fico: 9 de janeiro de 1822."], ["7 de setembro de 1822", "Às margens do riacho Ipiranga, Dom Pedro declarou: “Independência ou Morte!”. Ele foi o primeiro imperador. José Bonifácio e Dona Leopoldina o apoiaram.", "7 de setembro: independência."], ["Depois da independência", "Houve lutas, como na Bahia, em 2 de julho de 1823. A Constituição de 1824 organizou o Império. A escravidão continuou, e Dom Pedro II foi o segundo imperador.", "2 de julho: independência da Bahia."]],o:"Conhecer os fatos e as pessoas da Independência do Brasil.",h:"Conhecer os fatos e as pessoas da Independência do Brasil.",x:"Em 1808, fugindo de Napoleão, a família real portuguesa chegou ao Brasil e se instalou no Rio de Janeiro. Dom João abriu os portos e criou a Imprensa Régia.",e:"A Abertura dos Portos liberou o comércio."},
f5geo0:{p:[["Latitude e longitude", "As linhas imaginárias ajudam a localizar lugares. O Equador (0° de latitude) e o meridiano de Greenwich (0° de longitude) são as principais.", "Latitude: distância ao Equador."], ["Paralelos, meridianos e trópicos", "Os paralelos circundam a Terra de leste a oeste; os meridianos vão de um polo ao outro. O Trópico de Capricórnio passa por São Paulo e o Equador, pelo norte do Brasil.", "O Equador passa perto de Macapá."], ["Escalas", "A escala compara o mapa com a realidade. Em 1:100.000, 1 cm no mapa são 100.000 cm, ou 1 km.", "Escala maior: mais detalhes de uma área menor."], ["Tipos de mapa", "O mapa-múndi mostra toda a Terra e o globo a representa em esfera. Mapas podem ser políticos, físicos ou temáticos, como o populacional. Representar a esfera em um plano causa distorções.", "Mapa populacional: quantos habitantes há."], ["O Brasil no mapa", "O Brasil fica na América do Sul, quase todo no hemisfério sul e ocidental. Faz fronteira com quase todos os países da América do Sul, menos Chile e Equador. Brasília, no Centro-Oeste, é a capital.", "A Argentina faz fronteira com o Brasil."]],o:"Usar coordenadas, escalas e tipos de mapas.",h:"Usar coordenadas, escalas e tipos de mapas.",x:"As linhas imaginárias ajudam a localizar lugares. O Equador (0° de latitude) e o meridiano de Greenwich (0° de longitude) são as principais.",e:"Latitude: distância ao Equador."},
f5geo1:{p:[["Tempo e clima", "Tempo é o estado da atmosfera em um momento. Clima é o padrão do tempo de um lugar durante muitos anos.", "Hoje chove: tempo. No sertão chove pouco: clima."], ["Instrumentos", "Termômetro mede a temperatura, pluviômetro mede a chuva, anemômetro mede o vento, barômetro mede a pressão e higrômetro mede a umidade.", "Pluviômetro: chuva."], ["Zonas térmicas e climas do Brasil", "A Terra tem zonas tropical, temperada e polar. No Brasil há clima equatorial (Amazônia), semiárido (sertão) e subtropical (Sul).", "Sul: clima subtropical."], ["Estações do ano", "As estações são primavera, verão, outono e inverno. No hemisfério sul, o verão vai de dezembro a março, e as estações são opostas às do hemisfério norte.", "Verão no Brasil, inverno no hemisfério norte."], ["Efeito estufa e cuidados", "A atmosfera retém parte do calor do Sol: é o efeito estufa. O excesso de gás carbônico aumenta o aquecimento global. Plantar árvores e reduzir a queima de combustíveis ajuda.", "Plantar árvores ajuda o clima."]],o:"Diferenciar tempo e clima e reconhecer os climas do Brasil.",h:"Diferenciar tempo e clima e reconhecer os climas do Brasil.",x:"Tempo é o estado da atmosfera em um momento. Clima é o padrão do tempo de um lugar durante muitos anos.",e:"Hoje chove: tempo. No sertão chove pouco: clima."},
f5cie0:{p:[["Galáxias e Sistema Solar", "O Sistema Solar fica na galáxia Via Láctea, um enorme conjunto de estrelas, gás e poeira. Ele é formado pelo Sol e pelos astros que giram ao redor dele.", "A Via Láctea é a nossa galáxia."], ["Asteroides, cometas e planetas-anões", "Asteroides são corpos rochosos, muitos no cinturão entre Marte e Júpiter. Cometas têm gelo e uma cauda brilhante perto do Sol. Plutão é um planeta-anão.", "O cinturão de asteroides fica entre Marte e Júpiter."], ["Gravidade e órbitas", "A gravidade atrai os corpos para o centro de um astro. Por isso a Lua gira em órbita da Terra e os planetas giram em órbita do Sol.", "A Lua não cai porque está em órbita."], ["Exploração do espaço", "Em 1961, Yuri Gagarin foi o primeiro humano no espaço. Em 1969, Neil Armstrong pisou na Lua. Em 2006, Marcos Pontes foi o primeiro brasileiro no espaço. Satélites artificiais ajudam na comunicação, no tempo e no GPS.", "Marcos Pontes foi ao espaço em 2006."], ["Instrumentos e curiosidades", "O telescópio permite ver astros distantes. Vênus tem o dia mais longo, Saturno tem muitas luas e a Lua provoca as marés junto com o Sol.", "O telescópio mostra astros distantes."]],o:"Conhecer os astros, a gravidade, as órbitas e a exploração espacial.",h:"Conhecer os astros, a gravidade, as órbitas e a exploração espacial.",x:"O Sistema Solar fica na galáxia Via Láctea, um enorme conjunto de estrelas, gás e poeira. Ele é formado pelo Sol e pelos astros que giram ao redor dele.",e:"A Via Láctea é a nossa galáxia."},
f5cie2:{p:[["Células, tecidos e sistemas", "A célula é a menor unidade do corpo. Células iguais formam um tecido. Órgãos que trabalham juntos formam um sistema.", "O coração é órgão; o circulatório é sistema."], ["Circulação e respiração", "O coração tem 4 cavidades. As artérias levam o sangue do coração, e as veias trazem de volta. Respiramos oxigênio e eliminamos gás carbônico, com ajuda do diafragma.", "Os glóbulos vermelhos carregam oxigênio."], ["Digestão e excreção", "A digestão começa na boca, com a saliva. O fígado produz a bile e o intestino grosso absorve água. Os rins filtram o sangue e produzem a urina.", "O fígado produz a bile."], ["Ossos, nervos e sentidos", "O maior osso é o fêmur. O neurônio transmite mensagens. A retina forma a imagem no olho e a orelha capta os sons.", "O fêmur é o maior osso."], ["Hábitos de saúde", "Dormir de 9 a 11 horas, lavar as mãos e comer alimentos variados, como leite (cálcio) e carnes e ovos (proteína), protegem a saúde.", "O leite é fonte de cálcio."]],o:"Conhecer células, órgãos, sistemas e hábitos de saúde.",h:"Conhecer células, órgãos, sistemas e hábitos de saúde.",x:"A célula é a menor unidade do corpo. Células iguais formam um tecido. Órgãos que trabalham juntos formam um sistema.",e:"O coração é órgão; o circulatório é sistema."},
f5cie3:{p:[["Ecossistemas e teias", "Um ecossistema reúne seres vivos e elementos não vivos de um lugar. Uma teia alimentar liga várias cadeias alimentares.", "Se os produtores somem, os consumidores ficam sem alimento."], ["Biomas do Brasil", "A Amazônia é floresta tropical, a Caatinga é seca, o Cerrado é savana, o Pantanal é planície alagável, a Mata Atlântica cobria o litoral e o Pampa tem campos baixos.", "O mandacaru é da Caatinga."], ["Animais e plantas típicos", "O mico-leão-dourado vive na Mata Atlântica, o tuiuiú e o jacaré no Pantanal e o mandacaru na Caatinga.", "O mico-leão-dourado vive na Mata Atlântica."], ["Problemas ambientais", "O desmatamento derruba árvores e tira o habitat dos animais. Esgoto e lixo poluem a água. Algumas espécies correm risco de extinção.", "O desmatamento causa perda de habitat."], ["Sustentabilidade", "Ser sustentável é usar os recursos sem acabar com eles. Os 3 Rs são reduzir, reutilizar e reciclar. Bicicleta e transporte coletivo reduzem a poluição do ar.", "Reduzir, reutilizar, reciclar."]],o:"Conhecer biomas, teias alimentares e atitudes sustentáveis.",h:"Conhecer biomas, teias alimentares e atitudes sustentáveis.",x:"Um ecossistema reúne seres vivos e elementos não vivos de um lugar. Uma teia alimentar liga várias cadeias alimentares.",e:"Se os produtores somem, os consumidores ficam sem alimento."},
f5ing0:{p:[["Was e were", "O verbo to be no passado tem duas formas: was e were. Usamos para dizer como alguém estava ou onde estava.", "I was at home."], ["Quando usar was", "Com I, he, she e it usamos was.", "She was in the park."], ["Quando usar were", "Com you, we e they usamos were.", "They were happy."], ["Negativa e pergunta", "Na negativa, colocamos not: was not (wasn't) e were not (weren't). Na pergunta, o verbo vem primeiro: Was she at home?", "He wasn't at school."], ["Respostas curtas", "Respondemos só com o verbo: Yes, I was. No, they weren't.", "Were you late? No, I wasn't."]],o:"Usar was e were.",h:"Usar was e were.",x:"O verbo to be no passado tem duas formas: was e were. Usamos para dizer como alguém estava ou onde estava.",e:"I was at home."},
f5ing1:{p:[["Present simple", "O present simple fala de rotina e de fatos: o que fazemos sempre.", "I wake up at seven."], ["Com he, she e it", "Com he, she e it, o verbo ganha s no final: she plays, he works. Alguns verbos mudam: study vira studies e go vira goes.", "She goes to school."], ["Negativa", "Na negativa, usamos don't (I, you, we, they) e doesn't (he, she, it) com o verbo sem s.", "He doesn't work on Sunday."], ["Perguntas", "Na pergunta, usamos do ou does no começo e o verbo sem s.", "Does she play the piano?"], ["Rotina", "Palavras como every day, always e on Monday ajudam a falar de rotina.", "We study English every day."]],o:"Usar o present simple em frases afirmativas, negativas e perguntas.",h:"Usar o present simple em frases afirmativas, negativas e perguntas.",x:"O present simple fala de rotina e de fatos: o que fazemos sempre.",e:"I wake up at seven."},
f5ing2:{p:[["Meses", "January é janeiro, March é março e July é julho.", "July é julho."], ["Estações", "Winter é inverno e summer é verão.", "Summer é verão."], ["Números", "Eleven é onze, twelve é doze e twenty é vinte.", "Twenty é vinte."], ["Em casa", "Kitchen é cozinha, bedroom é quarto e garden é jardim.", "Kitchen é cozinha."], ["Profissões", "Doctor é médico e nurse é enfermeira.", "Nurse é enfermeira."]],o:"Reconhecer palavras simples em inglês.",h:"Reconhecer palavras simples em inglês.",x:"January é janeiro, March é março e July é julho.",e:"July é julho."},
f4por2:{p:[["Escrever certo", "Escrever bem ajuda os outros a entender o que escrevemos. Quando temos dúvida, olhamos a palavra com atenção e pensamos em como ela aparece nos livros.", ""], ["X ou CH", "Algumas palavras usam x e outras usam ch, mesmo com o mesmo som: enxada, xícara, chuveiro.", "Enxada e xícara têm X. Chuveiro tem CH."], ["S, Z, Ç e SS", "O som de s pode ser escrito de formas diferentes: cidade, cenoura, açougue, paciência.", "Cidade e cenoura começam com C; açougue tem Ç."], ["G ou J", "O som de j pode ser escrito com g ou j: gengibre, viagem, imagem, laranja.", "Gengibre e viagem levam G; laranja leva J."], ["Acentos", "Palavras como música, lâmpada, relógio, árvore e sábado levam acento. Sem o acento, a palavra fica errada.", "Música tem acento no ú."]],o:"Escrever corretamente palavras com x/ch, s/z/ç/ss, g/j e acentos.",h:"Escrever palavras com regularidades e irregularidades ortográficas comuns.",x:"Lembre das letras que mudam a escrita (x, ch, ç, g, j) e dos acentos. Se tiver dúvida, olhe a palavra com atenção.",e:"Enxada, cidade, viagem, música."},
f4por3:{p:[["Sinais de pontuação", "A pontuação organiza o texto e mostra como ler. Além do ponto final, da interrogação e da exclamação, usamos vírgula, dois-pontos, travessão e reticências.", "Compare: “Vamos comer, Ana.” e “Vamos comer Ana.”"], ["Vírgula", "A vírgula separa os itens de uma lista, chama alguém e marca uma pausa.", "Comprei pão, leite e queijo. Maria, venha cá."], ["Dois-pontos", "Os dois-pontos aparecem antes de uma lista, de uma fala ou de uma explicação.", "Vou levar três coisas: água, lanche e boné."], ["Travessão", "O travessão mostra a fala de um personagem em um diálogo.", "— Onde você vai? perguntou a mãe."], ["Reticências e sinais finais", "As reticências mostram dúvida ou suspense. O ponto final conta algo, a interrogação pergunta e a exclamação mostra emoção.", "Será que ele vem…"]],o:"Escolher o sinal de pontuação adequado em cada frase.",h:"Reconhecer e usar sinais de pontuação em frases e diálogos.",x:"Vírgula separa itens e chama pessoas, dois-pontos anunciam listas e falas, travessão marca diálogos e reticências mostram dúvida.",e:"Comprei frutas: maçã, uva e pera."},
f4por4:{p:[["Gêneros e suas marcas", "Cada gênero textual tem marcas que ajudam a reconhecê-lo: como começa, quem fala e para que serve.", "“Era uma vez” é marca de conto e fábula."], ["Textos que contam", "A fábula tem animais que falam e termina com uma lição. A lenda conta histórias populares com seres fantásticos. A biografia conta a vida de uma pessoa.", "O Saci aparece em uma lenda."], ["Textos que informam", "A notícia informa um fato recente. O verbete explica o significado de uma palavra. A entrevista tem perguntas e respostas.", "Verbete: Girassol: planta de flor amarela."], ["Textos do dia a dia", "O e-mail tem assunto e destinatário. O anúncio divulga algo. A carta tem local, data, saudação e despedida. O convite chama alguém para um evento.", "“Vende-se bicicleta” é um anúncio."], ["Textos para ensinar, rimar e narrar com imagens", "A receita ensina a cozinhar. O poema tem versos, estrofes e rimas. A história em quadrinhos conta com desenhos e balões.", "Os balões guardam as falas dos quadrinhos."]],o:"Reconhecer vários gêneros pelas suas marcas e funções.",h:"Identificar gêneros textuais e suas características.",x:"Cada gênero tem pistas: a fábula tem moral, a lenda tem seres fantásticos, a entrevista tem perguntas e respostas, o verbete explica palavras.",e:"“— Qual é a sua cor favorita? — Azul.” é uma entrevista."},
f4cie0:{p:[["Planetas rochosos e gasosos", "Os quatro planetas mais próximos do Sol (Mercúrio, Vênus, Terra e Marte) são rochosos. Júpiter, Saturno, Urano e Netuno são gigantes gasosos.", "Júpiter é um planeta gasoso."], ["Curiosidades dos planetas", "Vênus é o mais quente. Júpiter tem a Grande Mancha Vermelha. Mercúrio é o menor planeta. Urano gira como se estivesse deitado.", "Vênus é mais quente que Mercúrio."], ["A Lua e suas fases", "A Lua gira em torno da Terra e muda de aparência: nova, crescente, cheia e minguante. O ciclo dura cerca de um mês.", "Na lua cheia vemos o disco inteiro."], ["Eclipses", "No eclipse do Sol, a Lua passa entre a Terra e o Sol. No eclipse da Lua, a Terra fica entre o Sol e a Lua.", "A Lua tapa o Sol no eclipse solar."], ["Estações, dia e ano", "A Terra gira em torno de si (cerca de 24 horas) e em torno do Sol (cerca de 365 dias). Como ela é inclinada, existem as estações do ano. As estrelas formam constelações, como o Cruzeiro do Sul.", "O Cruzeiro do Sul tem forma de cruz."]],o:"Conhecer os astros, as fases da Lua, os eclipses e os movimentos da Terra.",h:"Reconhecer fenômenos astronômicos e movimentos da Terra e da Lua.",x:"Há planetas rochosos e gasosos. A Lua tem fases, os eclipses acontecem quando Sol, Terra e Lua se alinham e as estações vêm da inclinação da Terra.",e:"Vênus é o planeta mais quente."},
f4cie2:{p:[["Os sistemas do corpo", "O corpo funciona por sistemas que trabalham juntos: digestório, respiratório, circulatório, esquelético, muscular e nervoso.", "O sistema circulatório leva o sangue."], ["Digerir e respirar", "O alimento passa pela boca, pelo esôfago, pelo estômago e pelo intestino, onde os nutrientes são absorvidos. O ar entra pelo nariz e pela boca e o oxigênio passa para o sangue nos pulmões.", "O intestino delgado absorve os nutrientes."], ["Ossos, músculos e nervos", "O esqueleto tem cerca de 206 ossos num adulto. Os músculos se ligam aos ossos pelos tendões e permitem o movimento. O cérebro comanda o corpo.", "Os músculos ficam mais fortes com exercício."], ["Alimentos e energia", "Carboidratos dão energia, proteínas ajudam o corpo a crescer e frutas e verduras trazem vitaminas.", "Pão e arroz dão energia."], ["Saúde", "Vacinas ajudam o corpo a se defender. Lavar as mãos, cobrir a boca ao tossir e dormir bem protegem a saúde.", "Cobrir a boca ao tossir evita espalhar germes."]],o:"Conhecer os sistemas do corpo, a alimentação e os cuidados com a saúde.",h:"Reconhecer sistemas do corpo humano, nutrição e hábitos de saúde.",x:"Cada sistema tem uma função: digerir, respirar, levar o sangue, sustentar, mover e comandar. A alimentação e as vacinas ajudam a manter a saúde.",e:"Os pulmões passam o oxigênio para o sangue."},
f4his0:{p:[["Capitanias e Governo-Geral", "Em 1534, Portugal dividiu o território em capitanias hereditárias, entregues a donatários. Em 1549, criou o Governo-Geral, e Tomé de Sousa fundou Salvador, a primeira capital.", "Salvador foi fundada em 1549."], ["Jesuítas e bandeirantes", "Os jesuítas fundaram escolas e missões para ensinar a fé católica. Os bandeirantes exploraram o interior à procura de riquezas.", "Os bandeirantes entravam pelo interior."], ["O ouro de Minas Gerais", "No fim do século XVII, foi descoberto ouro em Minas Gerais. Cidades como Vila Rica (hoje Ouro Preto) cresceram, e os tropeiros levavam mercadorias em mulas.", "Vila Rica é a atual Ouro Preto."], ["Escravidão e quilombos", "Pessoas africanas escravizadas faziam o trabalho pesado nos engenhos e nas minas. Muitas fugiram e formaram quilombos, como Palmares, liderado por Zumbi.", "Em 20 de novembro lembramos Zumbi."], ["Inconfidência Mineira", "Em 1789, um grupo em Minas Gerais quis se libertar do domínio português. Um dos líderes foi Tiradentes, lembrado em 21 de abril.", "Tiradentes foi líder da Inconfidência Mineira."]],o:"Conhecer como a colônia foi organizada e quem participou da sua história.",h:"Reconhecer fatos, pessoas e processos do período colonial do Brasil.",x:"A colônia foi organizada em capitanias e depois no Governo-Geral. O ouro de Minas, a escravidão, os quilombos e a Inconfidência Mineira marcam esse período.",e:"Tomé de Sousa fundou Salvador em 1549."},
f4geo0:{p:[["Pontos cardeais e colaterais", "Os pontos cardeais são norte, sul, leste e oeste. Entre eles ficam os colaterais: nordeste, noroeste, sudeste e sudoeste.", "Entre o norte e o leste fica o nordeste."], ["Linhas imaginárias", "O Equador divide a Terra em hemisfério norte e sul. O meridiano de Greenwich divide a Terra em hemisfério leste e oeste. A maior parte do Brasil fica no hemisfério sul.", "O Equador é uma linha imaginária."], ["Escala e tipos de mapa", "A escala compara o tamanho no mapa com o tamanho real. Se 1 cm = 10 km, 3 cm são 30 km. O mapa político mostra divisões, o físico mostra relevo e águas e o temático mostra um assunto.", "Com 1 cm = 5 km, 4 cm são 20 km."], ["Se localizar", "Os pontos de referência e a bússola ajudam a se localizar. O GPS mostra onde estamos e traça rotas.", "A bússola aponta para o norte."], ["O Brasil no mundo", "O Brasil fica na América do Sul e é banhado pelo oceano Atlântico. Sua capital é Brasília. O IBGE divide o país em cinco regiões, e cada estado tem municípios.", "Norte, Nordeste, Centro-Oeste, Sudeste e Sul."]],o:"Usar escala, linhas imaginárias e orientação para entender mapas.",h:"Orientar-se e interpretar mapas usando escala, coordenadas e pontos de referência.",x:"Os colaterais ficam entre os cardeais, o Equador divide norte e sul e a escala diz quanto vale cada centímetro do mapa.",e:"1 cm = 10 km: 3 cm são 30 km."},
f4ing0:{p:[["Negativa", "Para dizer que algo não é, colocamos not depois do verbo to be: I am not, you are not, he is not.", "He is not sad."], ["Pergunta", "Para perguntar, colocamos o verbo to be antes: Am I late? Are you ready? Is she a doctor?", "Is it cold?"], ["Respostas curtas", "Podemos responder só com o verbo: Yes, I am. No, she isn't. No, they aren't.", "Are you a student? Yes, I am."], ["Formas curtas", "Is not vira isn't e are not vira aren't. I am vira I'm.", "She isn't tall."], ["Praticando", "Para escolher o verbo, olhe quem fala: I usa am, he, she e it usam is e you, we e they usam are.", "We are not tired."]],o:"Usar o verbo to be em frases negativas e perguntas.",h:"Usar o verbo to be em frases negativas, interrogativas e respostas curtas.",x:"Na negativa, usamos not depois do verbo. Na pergunta, o verbo vem primeiro. Isn't e aren't são formas curtas.",e:"Are they students? No, they aren't."},
f4ing2:{p:[["Dias da semana", "Monday é segunda-feira, Tuesday é terça-feira, Friday é sexta-feira e Sunday é domingo.", "Sunday é domingo."], ["Frutas", "Banana é banana, grape é uva e strawberry é morango.", "Grape é uva."], ["Roupas", "Shirt é camisa, shoes são sapatos e hat é chapéu.", "Hat é chapéu."], ["O tempo", "Sunny é ensolarado, rainy é chuvoso e cloudy é nublado.", "Rainy é chuvoso."], ["Como lembrar", "Associe cada palavra a uma imagem e repita em voz alta. Falar um pouquinho todo dia ajuda a lembrar.", ""]],o:"Dizer em inglês dias da semana, frutas, roupas e o tempo.",h:"Reconhecer palavras simples em inglês do dia a dia.",x:"Em inglês, Monday é segunda-feira, grape é uva, shirt é camisa e sunny é ensolarado.",e:"Cloudy quer dizer nublado."},
f4mat0:{p:[["Números até 10 000","Os números agora podem ter quatro algarismos. Cada posição tem um valor: unidades, dezenas, centenas e unidades de milhar.","No número 3 425, o algarismo 3 vale 3 000."],["Decompor números","Podemos separar o número em partes, de acordo com o valor de cada algarismo.","3 425 = 3 000 + 400 + 20 + 5."],["Comparar números","Compare da esquerda para a direita, começando pela maior ordem. O primeiro algarismo diferente decide qual é maior.","4 530 é maior que 4 352, porque 5 centenas é mais que 3 centenas."],["Somar e subtrair","Para somar ou subtrair números grandes, trabalhe com unidades, dezenas, centenas e milhares, uma ordem de cada vez.","1 250 + 340 = 1 590. E 5 000 − 2 750 = 2 250."],["Multiplicar e dividir","Multiplicar é somar parcelas iguais. Dividir é repartir em partes iguais. A tabuada ajuda nas duas contas.","8 × 9 = 72. E 63 ÷ 9 = 7, porque 9 × 7 = 63."],["Arredondar","Para arredondar para a dezena mais próxima, olhe o algarismo da unidade: se for 5 ou mais, a dezena sobe; se for menor que 5, ela fica.","47 arredonda para 50. E 83 arredonda para 80."]],o:"Ler, comparar e operar com números até 10 000 e arredondar.",h:"Ler, escrever, comparar e operar com números naturais até 10 000.",x:"Cada algarismo tem um valor conforme a posição. Compare da esquerda para a direita. Multiplicar soma parcelas iguais e dividir reparte em partes iguais.",e:"3 425 = 3 000 + 400 + 20 + 5."},
f4mat2:{p:[["Partes de um todo","Uma fração mostra quantas partes iguais pegamos de um todo. Se uma barra foi dividida em 8 partes iguais e pintamos 3, a parte pintada é 3/8.","3/8 lê-se três oitavos."],["Numerador e denominador","O denominador (embaixo) diz em quantas partes o todo foi dividido. O numerador (em cima) diz quantas partes foram tomadas.","Em 5/6: numerador 5 e denominador 6."],["Comparar frações","Com o mesmo denominador, a maior fração é a que tem o maior numerador.","5/7 é maior que 3/7."],["Fração de uma quantidade","Para achar a fração de uma quantidade, divida pelo denominador e multiplique pelo numerador.","3/4 de 20: 20 ÷ 4 = 5 e 5 × 3 = 15."],["Frações equivalentes","Frações diferentes podem representar a mesma parte do todo. Multiplicar em cima e embaixo pelo mesmo número dá uma fração equivalente.","1/2 = 2/4 = 3/6."]],o:"Reconhecer, comparar e calcular com frações.",h:"Representar, comparar e calcular frações simples.",x:"A fração tem numerador e denominador. Com denominadores iguais, o maior numerador é a maior fração. Para a fração de uma quantidade, divida e multiplique.",e:"1/4 de 12 = 3."},
f4mat3:{p:[["Décimos e centésimos","Quando o inteiro é dividido em 10 partes iguais, cada parte é um décimo (0,1). Dividido em 100 partes, cada parte é um centésimo (0,01).","1/10 = 0,1 e 1/100 = 0,01."],["Fração e decimal","Uma fração com denominador 10 ou 100 pode ser escrita como número decimal.","3/10 = 0,3 e 25/100 = 0,25."],["Posição dos algarismos","Depois da vírgula, a primeira casa é a dos décimos e a segunda é a dos centésimos.","Em 3,47, o 4 são 4 décimos e o 7 são 7 centésimos."],["Comparar decimais","Compare primeiro a parte inteira. Se for igual, compare os décimos e, depois, os centésimos.","0,5 é maior que 0,45, porque 5 décimos é mais que 4 décimos."],["Dinheiro","Os preços usam decimais: reais antes da vírgula e centavos depois. Some e subtraia alinhando as vírgulas.","R$ 3,50 + R$ 2,25 = R$ 5,75."]],o:"Ler, comparar e operar com números decimais, inclusive com dinheiro.",h:"Ler, escrever, comparar e operar com números decimais até os centésimos.",x:"Depois da vírgula ficam os décimos e os centésimos. Compare a parte inteira primeiro. Alinhe as vírgulas para somar e subtrair.",e:"0,25 = 25/100. R$ 10,00 − R$ 7,50 = R$ 2,50."},
f4por0:{p:[["Ler com atenção","Em textos maiores, é importante ler tudo antes de responder e pensar no assunto principal.","Leia: “Helena foi ao parque com o irmão.”"],["Para onde? Com quem?","Para saber o lugar, procure para onde ou em que lugar alguém foi. Para saber a companhia, procure com quem.","Helena foi ao parque, com o irmão."],["Como?","Procure palavras que dizem como alguém estava ou se sentiu, geralmente perto do fim do texto.","Voltou cansada e feliz."],["O assunto do texto","O título combina com o assunto principal: aquilo de que o texto mais fala.","Um bom título: “Um passeio no parque”."],["Volte ao texto","Se esquecer a resposta, releia e confira no texto. A resposta sempre está nele.",""]],o:"Achar no texto informações como lugar, companhia e sentimento, e descobrir o assunto.",h:"Localizar e relacionar informações em textos curtos e identificar o assunto principal.",x:"Leia tudo, procure onde, com quem e como, e pense no assunto principal. Confira sempre no texto.",e:"“Rafael foi ao museu com a turma.” Onde? No museu. Com quem? Com a turma."},
f4por1:{p:[["Classes de palavras","As palavras se dividem em classes, e cada classe tem um papel na frase: substantivo, adjetivo, verbo e artigo.","Na frase “A menina corre”, há palavras de classes diferentes."],["Substantivo","O substantivo dá nome a pessoas, animais, lugares e coisas.","menina, cachorro, escola, livro."],["Adjetivo","O adjetivo diz como alguém ou algo é: suas qualidades.","menino corajoso, casa grande, flor bonita."],["Verbo","O verbo indica ação, como correr, escrever e brincar.","As crianças brincam no parque."],["Artigo","O artigo acompanha o substantivo: o, a, os, as, um, uma.","a menina, um livro."]],o:"Reconhecer substantivo, adjetivo, verbo e artigo em frases.",h:"Reconhecer classes de palavras e seu papel na frase.",x:"Substantivo dá nome, adjetivo diz como é, verbo indica ação e artigo acompanha o substantivo.",e:"“O gato preto dorme”: gato é substantivo, preto é adjetivo, dorme é verbo."},
f4cie3:{p:[["Seres vivos e ambiente","Os seres vivos dependem do ambiente para viver. Eles precisam de água, ar, alimento e abrigo. Os elementos não vivos, como a água, também fazem parte do ambiente.","Uma árvore é um ser vivo. A água não é, mas é essencial para ela."],["Produtores e fotossíntese","As plantas produzem o próprio alimento usando a luz do Sol, a água e o ar. Esse processo se chama fotossíntese, e as plantas são os produtores.","O capim é um produtor."],["Cadeia alimentar","Uma cadeia alimentar mostra quem come quem. Ela começa com o produtor, passa pelos consumidores e termina nos decompositores.","Capim → gafanhoto → sapo."],["Tipos de alimentação","Os herbívoros comem plantas, os carnívoros comem outros animais e os onívoros comem plantas e animais. Os predadores caçam outros animais.","Vaca é herbívora, leão é carnívoro e urso é onívoro."],["Cuidar do ambiente","Para cuidar do ambiente: economizar água, separar o lixo, reciclar e não poluir os rios. Na coleta seletiva, azul é papel e verde é vidro.","Fechar a torneira ao escovar os dentes economiza água."]],o:"Entender como os seres vivos se alimentam e se relacionam com o ambiente, e como cuidar dele.",h:"Reconhecer cadeias alimentares, tipos de alimentação e atitudes de cuidado com o ambiente.",x:"Plantas produzem alimento. Os animais se alimentam de plantas ou de outros animais. Os decompositores reaproveitam os restos. Devemos economizar água e reciclar.",e:"Capim → gafanhoto → sapo."},
